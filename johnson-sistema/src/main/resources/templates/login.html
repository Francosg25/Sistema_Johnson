<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Johnson Electric</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --je-orange: #F5821F;
            --je-dark: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fa;
            position: relative;
            overflow: hidden;
        }

        /* --- DECORATIVE BLOBS --- */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(245, 130, 31, 0.2) 0%, rgba(245, 130, 31, 0.05) 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
        }
        .blob-1 { top: -100px; left: -100px; }
        .blob-2 { bottom: -100px; right: -100px; background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0.05) 100%); }

        /* --- GLASS CARD --- */
        .glass-login-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05), 0 5px 15px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 440px;
            padding: 3rem;
            position: relative;
            z-index: 10;
        }

        .brand-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .brand-logo-text {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -1px;
            color: var(--je-dark);
            line-height: 1;
        }
        .brand-logo-text span {
            font-weight: 300;
            color: var(--je-orange);
            letter-spacing: 2px;
            display: block;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        h4 {
            font-weight: 700;
            color: var(--je-dark);
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-right: none;
            color: #94a3b8;
            border-radius: 12px 0 0 12px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 0 12px 12px 0;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            color: var(--je-dark);
        }
        .form-control:focus {
            background: white;
            border-color: var(--je-orange);
            box-shadow: 0 0 0 4px rgba(245, 130, 31, 0.1);
            outline: none;
        }

        .btn-je-login {
            background: linear-gradient(135deg, #F5821F 0%, #e67615 100%);
            border: none;
            border-radius: 12px;
            padding: 0.9rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 8px 20px rgba(245, 130, 31, 0.25);
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .btn-je-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(245, 130, 31, 0.35);
            color: white;
        }
        .btn-je-login:active {
            transform: translateY(0);
        }

        .alert {
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            padding: 1rem;
        }
        .alert-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .alert-success { background: rgba(16, 185, 129, 0.1); color: #10b981; }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="glass-login-card">
        <div class="brand-section">
            <div class="brand-logo-text">
                JOHNSON
                <span>ELECTRIC</span>
            </div>
        </div>

        

        <div th:if="${param.error}" class="alert alert-danger mb-4">
            <i class="bi bi-exclamation-circle-fill me-2"></i> Usuario o contraseña inválidos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success mb-4">
            <i class="bi bi-check-circle-fill me-2"></i> Sesión cerrada con éxito.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Tu usuario" required autofocus>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="" required>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-je-login">
                    INICIAR SESIÓN <i class="bi bi-arrow-right-short ms-1"></i>
                </button>
            </div>
        </form>

        <div class="footer-text">
            &copy; 2026 Johnson Electric - Dashboard APQP
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
