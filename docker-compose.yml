services:
  db:
    image: postgres:15-alpine
    container_name: johnson_db
    restart: always
    environment:
      - POSTGRES_DB=johnsondb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=johnsonbase2026
    ports:
      - "5444:5432" # Solo para tu desarrollo local
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d johnsondb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: johnson_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/johnsondb
      DB_USER: admin
      DB_PASSWORD: johnsonbase2026
    volumes:
      - ./backups:/app/backups
      - ./evidencias:/app/evidencias
    restart: always

  nginx:
    image: nginx:alpine
    container_name: johnson_nginx
    depends_on:
      - app
    ports:
      - "80:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro 
    restart: always