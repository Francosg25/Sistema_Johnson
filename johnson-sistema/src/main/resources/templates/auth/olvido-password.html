<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <title>Forgot Password - Johnson Electric</title>
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 1rem;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .btn-je {
            background-color: #f5821f;
            color: white;
            border: none;
        }
        .btn-je:hover {
            background-color: #e67616;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-card animate__animated animate__fadeIn">
        <div class="text-center mb-4">
            <img src="/images/logo-je.webp" alt="Logo" style="width: 150px;">
            <h4 class="fw-bold mt-3">Forgot your password?</h4>
            <p class="text-muted small">Enter your email address and we'll send you a link to reset it.</p>
        </div>

        <div th:if="${mensaje}" class="alert alert-success small" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>

        <form th:action="@{/olvido-password}" method="post">
            <div class="mb-3">
                <label for="correo" class="form-label small fw-bold">Email Address</label>
                <input type="email" class="form-control" id="correo" name="correo" required placeholder="example@johnsonelectric.com">
            </div>
            <button type="submit" class="btn btn-je w-100 fw-bold py-2">Send Reset Link</button>
        </form>
        
        <div class="text-center mt-4">
            <a href="/login" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
    </div>
</body>
</html>
