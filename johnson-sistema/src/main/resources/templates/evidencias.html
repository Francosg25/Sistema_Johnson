<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; }
        
        .premium-card {
            border: none; border-radius: 16px; background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0,0,0,0.02);
            overflow: hidden;
        }
        
        .search-container {
            position: relative;
            max-width: 400px;
        }
        .search-container i {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: #94a3b8;
        }
        .search-input {
            padding-left: 40px; border-radius: 20px; border: 1px solid #e2e8f0;
            background-color: #f8fafc; font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .search-input:focus {
            background-color: #ffffff; border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); outline: none;
        }

        /* Tabla Premium */
        .table { margin-bottom: 0; }
        .table th {
            font-weight: 700; color: #64748b; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0; padding: 1rem;
            background-color: #f8fafc;
        }
        .table td {
            vertical-align: middle; padding: 1rem; border-color: #f1f5f9;
            color: #334155; font-size: 0.95rem; font-weight: 500;
        }
        .table-hover tbody tr:hover { background-color: #f8fafc; transition: background-color 0.2s ease; }
        
        /* Íconos de Archivo */
        .file-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 10px; margin-right: 15px;
            font-size: 1.2rem;
        }
        .icon-pdf { background-color: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .icon-excel { background-color: rgba(16, 185, 129, 0.1); color: #10b981; }
        .icon-word { background-color: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .icon-default { background-color: rgba(100, 116, 139, 0.1); color: #64748b; }
        
        .btn-action {
            width: 35px; height: 35px; border-radius: 8px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.2s; border: none; background: transparent;
        }
        .btn-download { color: #3b82f6; }
        .btn-download:hover { background-color: rgba(59, 130, 246, 0.1); transform: translateY(-2px); }
        .btn-delete { color: #ef4444; }
        .btn-delete:hover { background-color: rgba(239, 68, 68, 0.1); transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper">
            <div th:replace="~{fragments/sidebar :: sidebar(currentUri=${currentUri})}"></div>
        </div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>

            <main class="container-fluid p-4">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold text-dark m-0"><i class="bi bi-folder-symlink text-primary me-2"></i>Vault de Evidencias</h4>
                        <p class="text-muted small mt-1 mb-0">Repositorio global de todos los archivos subidos en los proyectos APQP.</p>
                    </div>
                    
                    <div class="search-container w-100">
                        <i class="bi bi-search"></i>
                        <input type="text" id="buscadorArchivos" class="form-control search-input" placeholder="Buscar por nombre, proyecto o entregable...">
                    </div>
                </div>

                <div class="card premium-card">
                    <div class="table-responsive">
                        <table class="table table-hover" id="tablaEvidencias">
                            <thead>
                                <tr>
                                    <th style="width: 35%;">Archivo</th>
                                    <th style="width: 20%;">Proyecto Asociado</th>
                                    <th style="width: 25%;">Entregable APQP</th>
                                    <th style="width: 10%;">Fecha Subida</th>
                                    <th style="width: 10%;" class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tr th:each="adj : ${adjuntos}" class="fila-archivo">
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <div class="file-icon" 
                                                 th:classappend="${#strings.endsWith(#strings.toLowerCase(adj.nombreArchivo), '.pdf') ? 'icon-pdf' : 
                                                                 (#strings.endsWith(#strings.toLowerCase(adj.nombreArchivo), '.xls') or #strings.endsWith(#strings.toLowerCase(adj.nombreArchivo), '.xlsx') ? 'icon-excel' : 
                                                                 (#strings.endsWith(#strings.toLowerCase(adj.nombreArchivo), '.doc') or #strings.endsWith(#strings.toLowerCase(adj.nombreArchivo), '.docx') ? 'icon-word' : 'icon-default'))}">
                                                <i class="bi"
                                                   th:classappend="${#strings.endsWith(#strings.toLowerCase(adj.nombreArchivo), '.pdf') ? 'bi-file-earmark-pdf-fill' : 
                                                                   (#strings.endsWith(#strings.toLowerCase(adj.nombreArchivo), '.xls') or #strings.endsWith(#strings.toLowerCase(adj.nombreArchivo), '.xlsx') ? 'bi-file-earmark-excel-fill' : 
                                                                   (#strings.endsWith(#strings.toLowerCase(adj.nombreArchivo), '.doc') or #strings.endsWith(#strings.toLowerCase(adj.nombreArchivo), '.docx') ? 'bi-file-earmark-word-fill' : 'bi-file-earmark-fill'))}">
                                                </i>
                                            </div>
                                            <div class="d-flex flex-column text-truncate" style="max-width: 300px;">
                                                <span class="text-dark text-truncate nombre-busqueda fw-bold" th:text="${adj.nombreArchivo}">Documento.pdf</span>
                                                <span class="text-muted small fw-normal">Documento adjunto</span> 
                                            </div>
                                        </div>
                                    </td>
                                    
                                    <td>
                                        <span class="badge bg-light text-dark border shadow-sm proyecto-busqueda" th:text="${adj.proyectoNombre}">Proyecto X</span>
                                    </td>
                                    
                                    <td>
                                        <span class="text-muted fw-normal entregable-busqueda" style="font-size: 0.85rem;" th:text="${adj.entregableInfo}">
                                            1.1 - Feasibility
                                        </span>
                                    </td>
                                    
                                    <td>
                                        <span class="text-muted fw-normal" style="font-size: 0.85rem;" 
                                              th:text="${adj.subidoEn != null ? #temporals.format(adj.subidoEn, 'dd MMM yyyy') : 'Sin fecha'}">01 Ene 2026</span>
                                    </td>
                                    
                                    <td class="text-center">
                                        <div class="d-flex justify-content-center gap-1">
                                            <a th:href="@{'/evidencias/descargar/' + ${adj.id}}" class="btn-action btn-download" title="Descargar">
                                                <i class="bi bi-cloud-arrow-down-fill fs-5"></i>
                                            </a>
                                        </div>


                                        <button type="button" class="btn-action btn-delete" title="Eliminar Permanentemente"
                                                th:data-id="${adj.id}" 
                                                th:data-nombre="${adj.nombreArchivo}"
                                                onclick="confirmarEliminacion(this.getAttribute('data-id'), this.getAttribute('data-nombre'))"
                                                sec:authorize="hasAnyRole('ADMIN', 'CHAMPION')">
                                                <i class="bi bi-trash3-fill fs-5"></i>
                                        </button>
                                    </td>
                                </tr>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div class="modal fade" id="modalConfirmarDeleteVault" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-danger text-white border-bottom-0 pb-3">
                    <h6 class="modal-title fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Eliminar Archivo</h6>
                    <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 bg-light text-center">
                    <p class="mb-2 text-dark">¿Borrar el archivo de la bóveda?</p>
                    <p id="vaultFileName" class="fw-bold text-danger text-truncate mb-0 small"></p>
                </div>
                <div class="modal-footer bg-light border-top-0 pt-0 pb-4 justify-content-center">
                    <button type="button" class="btn btn-outline-secondary btn-sm fw-bold px-3 shadow-sm" data-bs-dismiss="modal">Cancelar</button>
                    <form id="formDeleteVault" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm fw-bold px-4 shadow-sm">
                            <i class="bi bi-trash me-1"></i>Eliminar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('buscadorArchivos').addEventListener('keyup', function() {
            let filtro = this.value.toLowerCase();
            let filas = document.querySelectorAll('.fila-archivo');
            
            filas.forEach(function(fila) {
                let nombre = fila.querySelector('.nombre-busqueda').textContent.toLowerCase();
                let proyecto = fila.querySelector('.proyecto-busqueda').textContent.toLowerCase();
                let entregable = fila.querySelector('.entregable-busqueda').textContent.toLowerCase();
                
                if (nombre.includes(filtro) || proyecto.includes(filtro) || entregable.includes(filtro)) {
                    fila.style.display = '';
                } else {
                    fila.style.display = 'none';
                }
            });
        });

        function confirmarEliminacion(id, nombreArchivo) {
            document.getElementById('vaultFileName').textContent = nombreArchivo;
            document.getElementById('formDeleteVault').action = '/evidencias/eliminar-ajax/' + id; 
            
            document.getElementById('formDeleteVault').onsubmit = function(e) {
                e.preventDefault();
                let btn = this.querySelector('button[type="submit"]');
                let originalHtml = btn.innerHTML;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
                btn.disabled = true;

                fetch(this.action, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if(data.exito) {
                        window.location.reload(); 
                    } else {
                        alert("Error: " + data.mensaje);
                        btn.innerHTML = originalHtml; btn.disabled = false;
                    }
                }).catch(error => {
                    alert("Error de red.");
                    btn.innerHTML = originalHtml; btn.disabled = false;
                });
            };

            var miModal = new bootstrap.Modal(document.getElementById('modalConfirmarDeleteVault'));
            miModal.show();
        }
    </script>
</body>
</html>
