# Base de datos en memoria exclusiva para la fase de Test (CI/CD)
spring.datasource.url=jdbc:h2:mem:johnsontestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecto y DDL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# APAGAR MIGRACIONES POSTGRESQL EN ENTORNO TEST
spring.flyway.enabled=false
spring.sql.init.mode=never
# Configuración falsa de SMTP para evitar que EmailServicio colapse en Testing
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# Variables de entorno simuladas para el Cargador de Datos
app.admin.default-password=testPassword123!