<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        
        <div style="background-color: #0d6efd; color: white; padding: 20px; text-align: center;">
            <h2 style="margin: 0; font-size: 22px;">You were mentioned in a comment</h2>
        </div>
        
        <div style="padding: 30px;">
            <p style="font-size: 16px;">Hello <strong th:text="${usuario.nombreCompleto}">Team Member</strong>,</p>
            
            <p style="font-size: 16px;">
                <strong th:text="${autor}" style="color: #0d6efd;">User</strong> has mentioned you in a deliverable inside the APQP System.
            </p>
            
            <div style="background-color: #f8f9fa; padding: 20px; border-left: 4px solid #0d6efd; border-radius: 4px; margin: 25px 0;">
                <p style="margin: 0 0 10px 0; font-size: 14px; color: #6c757d; text-transform: uppercase; font-weight: bold;">Project Details</p>
                <p style="margin: 0 0 5px 0; font-size: 15px;"><strong>Project:</strong> <span th:text="${proyecto}">N/A</span></p>
                <p style="margin: 0; font-size: 15px;"><strong>Deliverable:</strong> <span th:text="${tarea}">N/A</span></p>
            </div>
            
            <div style="text-align: center; margin-top: 30px; margin-bottom: 10px;">
                <a th:href="${appUrl}" style="background-color: #0d6efd; color: white; padding: 12px 25px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; display: inline-block;">Reply to Comment</a>
            </div>
        </div>
        
        <div style="background-color: #f1f5f9; text-align: center; padding: 20px; font-size: 13px; color: #6c757d; border-top: 1px solid #e2e8f0;">
            <p style="margin: 0 0 5px 0;"><strong>Johnson Electric APQP System &copy; 2026</strong></p>
        </div>
    </div>
</body>
</html>
