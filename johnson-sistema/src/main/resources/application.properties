spring.application.name=johnson-sistema
server.port=8081

#CONFIGURACIÓN POSTGRESQL USANDO VARIABLES DE ENTORNO 
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5444/johnsondb?sslmode=disable}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:johnsonbase2026}
spring.datasource.driver-className=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0

#Dialecto para PostgreSQL 12 o superior
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

#Permitir subir evidencias de hasta 15 Megabytes
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:johnsonelectricapqp@gmail.com}
spring.mail.password=${MAIL_PASSWORD:jviahxfgodjajgnp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_USERNAME:johnsonelectricapqp@gmail.com}
app.mail.display-name=Johnson APQP System

app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:adminpass}

# BASE URL
app.base-url=${APP_BASE_URL:http://10.240.4.21}


spring.jpa.hibernate.ddl-auto=validate

#Encendemos Flyway
spring.flyway.enabled=true

# Le dice a Flyway "Si ya hay tablas, asume que la V1 ya está aplicada"
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=15m

# Habilitar compresión de respuestas HTTP para recursos estáticos y JSON
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript

# HTTP/2
server.http2.enabled=true
server.forward-headers-strategy=framework



