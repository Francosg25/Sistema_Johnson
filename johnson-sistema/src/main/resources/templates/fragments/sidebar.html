<div th:fragment="sidebar(currentUri)" class="sidebar-je d-flex flex-column shadow-sm" style="min-height: 100vh;">
    
    <div class="brand-logo d-flex flex-column align-items-center">
        <span class="fw-black" style="font-weight: 900; font-size: 1.4rem; letter-spacing: -1px;">JOHNSON</span>
        <span class="light small" style="letter-spacing: 3px; font-weight: 300;">ELECTRIC</span>
    </div>

    <ul class="nav flex-column mb-auto w-100 mt-3">
        <li class="nav-item">
            <a th:href="@{/}" class="nav-link" th:classappend="${currentUri == '/' || currentUri == '/index' || currentUri == '/proyectos'} ? 'active' : ''">
                <i class="bi bi-grid-fill"></i> <span>Dashboard</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/timeline}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/timeline')} ? 'active' : ''">
                <i class="bi bi-calendar3-range"></i> <span>Timeline</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/reportes}" class="nav-link" 
                th:classappend="${currentUri == 'reportes' or (currentUri != null and currentUri.startsWith('/reportes'))} ? 'active' : ''">
                <i class="bi bi-bar-chart-fill"></i> <span>Reports</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/evidencias}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/evidencias')} ? 'active' : ''">
                <i class="bi bi-archive-fill"></i> <span>Evidences</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/bitacora}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/bitacora')} ? 'active' : ''">
                <i class="bi bi-clock-history"></i> <span>Audit Trail</span>
            </a>
        </li>
        <li class="nav-item" th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}">
            <a th:href="@{/admin/usuarios}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/admin/usuarios')} ? 'active' : ''">
                <i class="bi bi-people-fill"></i> <span>Users</span>
            </a>
        </li>
    </ul>

    
    </div>
</div>
