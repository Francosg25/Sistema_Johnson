<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <style>
        body {
            background: linear-gradient(135deg, #f5821f 0%, #e0600d 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h3 class="fw-black text-dark">Nueva Contraseña</h3>
            <p class="text-muted small">Ingresa tu nueva contraseña para recuperar el acceso.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger small mb-4" th:text="${error}"></div>

        <form th:action="@{/recuperar-password}" method="post" onsubmit="return validarPassword()">
            <input type="hidden" name="token" th:value="${token}">
            
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Contraseña Nueva</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-primary"></i></span>
                    <input type="password" id="password" name="password" class="form-control bg-light border-start-0" required minlength="8">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Confirmar Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-check-circle text-primary"></i></span>
                    <input type="password" id="confirm_password" class="form-control bg-light border-start-0" required>
                </div>
                <div id="password_error" class="text-danger small mt-1 d-none">Las contraseñas no coinciden.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm mb-3">Actualizar Contraseña</button>
        </form>
    </div>

    <script>
        function validarPassword() {
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const error = document.getElementById('password_error');
            
            if (pass !== confirm) {
                error.classList.remove('d-none');
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
