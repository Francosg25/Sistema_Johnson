<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

    <style>
        .kpi-card {
            border-radius: 12px;
            padding: 1.5rem;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .kpi-card::after {
            content: ''; position: absolute; top: -50%; right: -20%;
            width: 100px; height: 100px; background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .bg-ontime { background: linear-gradient(135deg, #3ac47d 0%, #28a745 100%); }
        .bg-fulfilled { background: linear-gradient(135deg, #3f6ad8 0%, #0056b3 100%); }
        .bg-delayed { background: linear-gradient(135deg, #f7b924 0%, #fd7e14 100%); }
        .bg-escalation { background: linear-gradient(135deg, #d92550 0%, #dc3545 100%); }

        #visualization {
            width: 100%;
            height: 500px;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            background-color: #fff;
        }
        .vis-item.vis-dot {
            border-color: #3f6ad8;
            border-width: 3px;
            border-radius: 0; /* Forma de Rombo (Diamond) como en el PDF */
            transform: rotate(45deg);
        }
        .vis-item.vis-line {
            border-left-width: 3px;
            border-left-color: #3f6ad8;
        }
        .vis-labelset .vis-label {
            font-weight: bold;
            color: #495057;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .vis-time-axis .vis-text { color: #6c757d; font-weight: 500; }
    </style>
</head>
<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper">
            <div th:replace="~{fragments/sidebar :: sidebar(currentUri='/timeline')}"></div>
        </div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>

            <main class="container-fluid p-4">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold text-dark mb-1"><i class="bi bi-calendar3-range text-primary me-2"></i>Multiple Project Timeline</h4>
                        <p class="text-muted small mb-0">Vista general de hitos</p>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="kpi-card bg-ontime h-100">
                            <h6 class="text-white opacity-75 mb-1 text-uppercase fw-bold">On Time</h6>
                            <h2 class="fw-bold mb-0">113 <span class="fs-6 opacity-75">/ 45%</span></h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="kpi-card bg-fulfilled h-100">
                            <h6 class="text-white opacity-75 mb-1 text-uppercase fw-bold">Fulfilled</h6>
                            <h2 class="fw-bold mb-0">50 <span class="fs-6 opacity-75">/ 20%</span></h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="kpi-card bg-delayed h-100">
                            <h6 class="text-white opacity-75 mb-1 text-uppercase fw-bold">Delayed</h6>
                            <h2 class="fw-bold mb-0">75 <span class="fs-6 opacity-75">/ 30%</span></h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="kpi-card bg-escalation h-100">
                            <h6 class="text-white opacity-75 mb-1 text-uppercase fw-bold">Escalation</h6>
                            <h2 class="fw-bold mb-0">12 <span class="fs-6 opacity-75">/ 5%</span></h2>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                        <h6 class="m-0 fw-bold text-dark"><i class="bi bi-bar-chart-steps me-2"></i>Master Schedule</h6>
                        <span class="badge bg-light text-dark border"><i class="bi bi-circle-fill text-primary me-1"></i> Milestones</span>
                    </div>
                    <div class="card-body p-3">
                        <div id="visualization"></div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var container = document.getElementById('visualization');

            var rawGroups = /*[[${timelineGroups}]]*/ [];
            var rawItems = /*[[${timelineItems}]]*/ [];

            // Cargamos los datos en la librería
            var groups = new vis.DataSet(rawGroups);
            var items = new vis.DataSet(rawItems);

            var options = {
                groupOrder: 'id', 
                editable: false,     
                margin: {
                    item: 20, 
                    axis: 40
                },
                orientation: 'top', 
                timeAxis: {scale: 'month', step: 1} 
            };

            // Dibujar la línea de tiempo
            var timeline = new vis.Timeline(container, items, groups, options);
            
            // Ajustar la vista para que enfoque todos los hitos automáticamente
            timeline.fit(); 
        });
    </script>
</body>
</html>
