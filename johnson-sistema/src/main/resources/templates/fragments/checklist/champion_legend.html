<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="champion_legend">
    <div class="card glass-card border-0 shadow-sm mb-4">
        <div class="card-body py-3 px-4">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div class="d-flex flex-wrap gap-3 small fw-medium text-muted">
                    <div class="d-flex align-items-center" title="Quality Engineer">
                        <span class="badge champ-qe me-2 shadow-sm">QE</span> Quality
                    </div>
                    <div class="d-flex align-items-center" title="Process/Manufacturing Engineer">
                        <span class="badge champ-pe me-2 shadow-sm">PE</span> Process
                    </div>
                    <div class="d-flex align-items-center" title="Design/Product Engineer">
                        <span class="badge champ-de me-2 shadow-sm">DE</span> Design
                    </div>
                    <div class="d-flex align-items-center" title="Project Leader">
                        <span class="badge champ-proj me-2 shadow-sm">PROJ</span> Project Manager
                    </div>
                    <div class="d-flex align-items-center" title="Quality & Process (Responsabilidad Compartida)">
                        <span class="badge champ-qe-pe me-2 shadow-sm">QE/PE</span> Quality and Process
                    </div>
                    <div class="d-flex align-items-center" title="Cross-Functional Team">
                        <span class="badge champ-all me-2 shadow-sm">ALL</span> All Team (CFT)
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
