<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* --- TRANSIT ANIMATION STYLES --- */
        .transit-row {
            position: relative;
        }
        .transit-track {
            position: absolute;
            height: 2px;
            background: repeating-linear-gradient(to right, #3b82f6 0, #3b82f6 5px, transparent 5px, transparent 10px);
            z-index: 1;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.6;
        }
        .ship-moving {
            position: absolute;
            z-index: 3;
            font-size: 1.5rem;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: all 1s ease-in-out;
            background: transparent;
            border: none;
        }
        .factory-destination {
            position: absolute;
            z-index: 2;
            font-size: 1.5rem;
            top: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            border: none;
        }

        /* --- GLASSMORPHISM DECORATION --- */
        .bg-blob {
            position: fixed;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(245, 130, 31, 0.15) 0%, rgba(245, 130, 31, 0.05) 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }
        .blob-1 { top: -100px; right: -100px; }
        .blob-2 { bottom: -100px; left: -100px; background: linear-gradient(135deg, rgba(13, 110, 253, 0.12) 0%, rgba(13, 110, 253, 0.05) 100%); }

        /* --- GLASS CARDS --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.6) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            border-radius: 20px !important;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07) !important;
            overflow: hidden;
            height: 100%;
        }
        
        .premium-header {
            background: rgba(255, 255, 255, 0.3) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;
            padding: 1.25rem 1.5rem;
        }

        .premium-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #2b3035;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
        }
        .premium-icon {
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(63, 106, 216, 0.1);
            color: #3f6ad8;
            margin-right: 12px;
            font-size: 1.1rem;
        }
        
        .chart-container {
            position: relative;
            padding: 1.5rem;
            width: 100%;
        }
        .waterfall-container {
            overflow-y: auto; 
            overflow-x: hidden;
            padding-right: 10px;
        }
        .waterfall-container::-webkit-scrollbar { width: 8px; }
        .waterfall-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .waterfall-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .waterfall-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

        <div id="sidebar-wrapper"><div th:replace="~{fragments/sidebar :: sidebar(currentUri='reportes')}"></div></div>
        

        <div id="page-content-wrapper" class="w-100">
            
            <div th:replace="~{fragments/header :: header}"></div>

            
            

            <main class="container-fluid p-4">
                <!-- SECCION: MATRIZ DE ROADMAP EJECUTIVO  -->
                <div class="row mb-5">
                    <div class="col-12">
                        <div class="card glass-card border-0">

                                    Master Executive Roadmap <span id="currentYearBadge" class="badge bg-light text-dark ms-2"></span>
                                </h6>
                                <div class="d-flex gap-4 small fw-bold text-muted pe-3">
                                    <span>💰 CAR</span>
                                    <span>🚢 Ship</span>
                                    <span>🏭 Factory</span>
                                    <span>👥 Buy-off</span>
                                </div>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-borderless align-middle mb-0" style="min-width: 1400px; table-layout: fixed;">

                                            <tr>
                                                <th style="width: 280px; text-align: left;" class="ps-4 py-4 fw-900 text-uppercase small text-muted">Project</th>
                                                <th class="py-4 small text-uppercase fw-900 text-muted">Jan</th>
                                                <th class="py-4 small text-uppercase fw-900 text-muted">Feb</th>

                                                <th class="py-4 small text-uppercase fw-900 text-muted">Apr</th>
                                                <th class="py-4 small text-uppercase fw-900 text-muted">May</th>
                                                <th class="py-4 small text-uppercase fw-900 text-muted">Jun</th>
                                                <th class="py-4 small text-uppercase fw-900 text-muted">Jul</th>
                                                <th class="py-4 small text-uppercase fw-900 text-muted">Aug</th>
                                                <th class="py-4 small text-uppercase fw-900 text-muted">Sep</th>

                    </div>

                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card glass-card">
                            <div class="card-header premium-header d-flex justify-content-between align-items-center">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-water premium-icon"></i>
                                    Progress by Stage and Project
                                </h6>
                                <select id="selectCascadaProyecto" class="form-select form-select-sm border-0 bg-light fw-bold text-secondary shadow-none" style="width: auto; max-width: 600px; cursor: pointer;">
                                    <option value="GLOBAL">Global</option>
                                </select>
                            </div>                            <div class="card-body waterfall-container" style="max-height: 600px;">
                                <div id="cascadaInnerContainer" style="position: relative; width: 100%;">
                                    <canvas id="chartCascada"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

   

                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card glass-card">
                            <div class="card-header premium-header">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-bar-chart-fill premium-icon" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6;"></i>
                                    Global Progress Comparation (%)
                                </h6>
                            </div>
                            <div class="card-body chart-container" style="height: 400px;">
                                <canvas id="chartProgreso"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-5">
                    
                    <div class="col-md-6">
                        <div class="card glass-card">
                            <div class="card-header premium-header d-flex justify-content-between align-items-center">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-pie-chart-fill premium-icon" style="background: rgba(16, 185, 129, 0.1); color: #10b981;"></i>
                                    Health Task

                                <select id="selectHealthProyecto" class="form-select form-select-sm border-0 bg-light fw-bold text-secondary shadow-none" style="width: auto; max-width: 600px; cursor: pointer;">

                            <div class="card-body chart-container d-flex align-items-center justify-content-center" style="height: 350px;">
                                <canvas id="chartVolumen" style="max-height: 280px;"></canvas>

                        </div>

                    <div class="col-md-6">
                        <div class="card glass-card">
                            <div class="card-header premium-header d-flex justify-content-between align-items-center">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-speedometer2 premium-icon" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;"></i>
                                    Risk Meter
                                </h6>
                                <select id="selectRiesgoProyecto" class="form-select form-select-sm border-0 bg-light fw-bold text-secondary shadow-none" style="width: auto; max-width: 600px; cursor: pointer;">
                                    <option value="GLOBAL">Global</option>

                            <div class="card-body chart-container d-flex align-items-center justify-content-center flex-column pb-4" style="height: 350px;">

                <div class="modal fade" id="modalHitoDetalle" tabindex="-1" aria-hidden="true">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        
        var reportes = /*[[${datosGrafica}]]*/ [];
        var datosEstadoGlobal = /*[[${datosEstadoGlobal}]]*/ null;
        var datosCascada = /*[[${datosCascada}]]*/ []; 

        var nombres = reportes.map(r => r.nombreProyecto);
        var porcentajes = reportes.map(r => r.porcentaje);

        let chartProgresoInstance = null;
        let chartCascadaInstance = null;
        let chartVolumenInstance = null;
        let chartRiesgoInstance = null;
      
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.font.size = 13; 
        Chart.defaults.color = '#64748b'; 
        
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(15, 23, 42, 0.95)';
        Chart.defaults.plugins.tooltip.titleFont = { size: 14, weight: 'bold' };
        Chart.defaults.plugins.tooltip.bodyFont = { size: 13 };
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
        Chart.defaults.plugins.tooltip.usePointStyle = true;

        const paletteWaterfall = ['#3b82f6', '#0ea5e9', '#10b981', '#f59e0b', '#8b5cf6'];
        const paletteStatus = ['#10b981', '#ef4444', '#f59e0b', '#3b82f6']; 

        //1. GRAFICA DE BARRAS 
        const ctx1 = document.getElementById('chartProgreso');
        if(ctx1 && nombres.length > 0) {
            const context1 = ctx1.getContext('2d');
            let gradientBlue = context1.createLinearGradient(0, 0, 0, 400);
            gradientBlue.addColorStop(0, 'rgba(59, 130, 246, 1)');   
            gradientBlue.addColorStop(1, 'rgba(59, 130, 246, 0.1)'); 

            chartProgresoInstance = new Chart(context1, {
                type: 'bar',
                data: {
                    labels: nombres,
                    datasets: [{
                        label: 'Avance %',
                        data: porcentajes,
                        backgroundColor: gradientBlue,
                        borderColor: '#3b82f6',
                        borderWidth: 1,
                        borderRadius: { topLeft: 6, topRight: 6 },
                        barPercentage: 0.6, 
                        categoryPercentage: 0.8
                    }]
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    return nombres[context[0].dataIndex];
                                }
                            }
                        }
                    },
                    scales: { 
                        y: { beginAtZero: true, max: 100, border: { display: false }, ticks: { callback: v => v + '%' } },
                        x: { 
                            grid: { display: false }, 
                            border: { display: false },
                            ticks: {
                                maxRotation: 0, 
                                minRotation: 0,
                                font: { size: 13 },
                                callback: function(value, index, values) {
                                    let label = nombres[index] || '';
                                    return label.length > 40 ? label.substring(0, 25) + '..' : label;
                                }
                            }
                        }
                    }
                }
            });
        }

        //2. GRAFICA CASCADA 
        const ctxCascada = document.getElementById('chartCascada');
        const selectCascada = document.getElementById('selectCascadaProyecto');

        function updateChartCascada(dataToShow, reportesToShow) {
            const alturaMinimaPorBarra = 120; 
            const alturaCalculada = Math.max(dataToShow.length * alturaMinimaPorBarra, 350);
            document.getElementById('cascadaInnerContainer').style.height = alturaCalculada + 'px';

            const projectNamesCascada = dataToShow.map(d => {
                let n = d.nombreProyecto;
                return n.length > 25 ? n.substring(0, 25) + '...' : n;
            });
            const sopsCascada = dataToShow.map(d => d.sop); 
            const s1Data = [], s2Data = [], s3Data = [], s4Data = [], s5Data = [], totalData = [];

            dataToShow.forEach(d => {
                const capped = d.porcentajesPorFase.map(pct => Math.min(pct, 100));
                let p1 = Math.min((capped[0] || 0) / 5, 20); let p2 = Math.min((capped[1] || 0) / 5, 20);
                let p3 = Math.min((capped[2] || 0) / 5, 20); let p4 = Math.min((capped[3] || 0) / 5, 20);
                let p5 = Math.min((capped[4] || 0) / 5, 20);
                let end1 = p1; let end2 = end1 + p2; let end3 = end2 + p3; let end4 = end3 + p4; let end5 = end4 + p5;

                s1Data.push(p1 > 0 ? [0, end1] : null); s2Data.push(p2 > 0 ? [end1, end2] : null);
                s3Data.push(p3 > 0 ? [end2, end3] : null); s4Data.push(p4 > 0 ? [end3, end4] : null);
                s5Data.push(p5 > 0 ? [end4, end5] : null); totalData.push([0, end5]); 
            });

            const chartData = {
                labels: projectNamesCascada,
                datasets: [
                    { label: 'STAGE 1', data: s1Data, backgroundColor: paletteWaterfall[0], borderRadius: 4, barPercentage: 0.8, realPct: dataToShow.map(d => d.porcentajesPorFase[0]) }, 
                    { label: 'STAGE 2', data: s2Data, backgroundColor: paletteWaterfall[1], borderRadius: 4, barPercentage: 0.8, realPct: dataToShow.map(d => d.porcentajesPorFase[1]) },
                    { label: 'STAGE 3', data: s3Data, backgroundColor: paletteWaterfall[2], borderRadius: 4, barPercentage: 0.8, realPct: dataToShow.map(d => d.porcentajesPorFase[2]) },
                    { label: 'STAGE 4', data: s4Data, backgroundColor: paletteWaterfall[3], borderRadius: 4, barPercentage: 0.8, realPct: dataToShow.map(d => d.porcentajesPorFase[3]) },
                    { label: 'STAGE 5', data: s5Data, backgroundColor: paletteWaterfall[4], borderRadius: 4, barPercentage: 0.8, realPct: dataToShow.map(d => d.porcentajesPorFase[4]) },
                    { label: 'TOTAL',   data: totalData, backgroundColor: '#cbd5e1', borderRadius: 4, barPercentage: 0.8, realPct: reportesToShow.map(r => r.porcentaje) }
                ]
            };

            if (chartCascadaInstance) {
                chartCascadaInstance.data = chartData;
                chartCascadaInstance.update();
            } else {
                chartCascadaInstance = new Chart(ctxCascada, {
                    type: 'bar',
                    data: chartData,
                    plugins: [{
                        id: 'sopLabels',
                        afterDatasetsDraw(chart) {
                            const { ctx, data } = chart;
                            const totalDatasetIndex = data.datasets.findIndex(ds => ds.label === 'TOTAL');
                            if (totalDatasetIndex === -1) return;
                            const meta = chart.getDatasetMeta(totalDatasetIndex);
                            ctx.save(); ctx.textBaseline = 'middle';
                            meta.data.forEach((bar, index) => {
                                // Important: sopsCascada must be accessible here or passed via data
                                const currentSops = chart.config._config.customSops || sopsCascada;
                                if(!currentSops[index]) return; 
                                const textoSOP = "SOP: " + currentSops[index];
                                ctx.font = 'bold 11px Inter, sans-serif'; 
                                const textWidth = ctx.measureText(textoSOP).width;
                                ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
                                ctx.beginPath(); ctx.roundRect(bar.x + 12, bar.y - 12, textWidth + 12, 24, 6); ctx.fill();
                                ctx.fillStyle = '#ef4444'; ctx.fillText(textoSOP, bar.x + 18, bar.y);
                            });
                            ctx.restore();
                        }
                    }, {
                        id: 'barLabels',
                        afterDatasetsDraw(chart) {
                            const { ctx, data } = chart;
                            ctx.save();
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.font = 'bold 10px Inter, sans-serif';

                            chart.data.datasets.forEach((dataset, i) => {
                                if (dataset.label === 'TOTAL') return;
                                const meta = chart.getDatasetMeta(i);
                                meta.data.forEach((bar, index) => {
                                    const val = dataset.realPct && dataset.realPct[index];
                                    if (val > 0 && bar.width > 10) { 
                                        ctx.fillStyle = '#ffffff';
                                        ctx.fillText(Math.round(val) + '%', bar.x - (bar.width / 2), bar.y);
                                    }
                                });
                            });
                            ctx.restore();
                        }
                    }],
                    options: { 
                        indexAxis: 'y', 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        layout: { padding: { right: 130 } }, 
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const dataset = context.dataset;
                                        const index = context.dataIndex;
                                        const val = dataset.realPct[index];
                                        return dataset.label + ': ' + (val ? val.toFixed(1) : '0') + '%';
                                    }
                                }
                            }
                        },
                        scales: { 
                            x: { max: 100, border: { display: false }, ticks: { callback: v => v + '%' } }, 
                            y: { grid: { display: false }, border: { display: false }, ticks: { font: { weight: 'bold', color: '#334155', size: 12 } } } 
                        },
                        interaction: { mode: 'y' } 
                    }
                });
            }
            // Store current sops for the plugin
            chartCascadaInstance.config._config.customSops = sopsCascada;
        }

        if (ctxCascada && datosCascada.length > 0) {
            updateChartCascada(datosCascada, reportes);

            if (selectCascada) {
                selectCascada.innerHTML = '<option value="GLOBAL">Global</option>';
                datosCascada.forEach((d, index) => {
                    let opt = document.createElement('option');
                    opt.value = index;
                    let n = d.nombreProyecto;
                    opt.textContent = n.length > 40 ? n.substring(0, 40) + '...' : n;
                    selectCascada.appendChild(opt);
                });

                selectCascada.addEventListener('change', function() {
                    const val = this.value;
                    if (val === 'GLOBAL') {
                        updateChartCascada(datosCascada, reportes);
                    } else {
                        updateChartCascada([datosCascada[val]], [reportes[val]]);
                    }
                });
            }
        }
   
        //3. GRAFICA DONA (HEALTH TASK)
        const ctx3 = document.getElementById('chartVolumen');
        const selectHealth = document.getElementById('selectHealthProyecto');

        if (ctx3 && datosEstadoGlobal) {
            chartVolumenInstance = new Chart(ctx3, {
                type: 'doughnut',
                data: {
                    labels: ['ON TIME', 'LATE', 'NEEDS ACTION', 'DECISION'],
                    datasets: [{
                        data: [datosEstadoGlobal.onTimePercentage, datosEstadoGlobal.latePercentage, datosEstadoGlobal.needsActionPercentage, datosEstadoGlobal.decisionPercentage],
                        rawCounts: [datosEstadoGlobal.onTimeCount, datosEstadoGlobal.delayedCount, datosEstadoGlobal.escalationCount, datosEstadoGlobal.decisionCount || 0],
                        backgroundColor: paletteStatus, borderWidth: 0, borderRadius: 4, spacing: 2, hoverOffset: 8
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, cutout: '75%', 
                    plugins: { 
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const dataset = context.dataset;
                                    const count = dataset.rawCounts[context.dataIndex];
                                    const percentage = dataset.data[context.dataIndex];
                                    return label + ': ' + count + ' deliverables (' + percentage + '%)';
                                }
                            }
                        },
                        legend: { 
                            position: 'bottom', 
                            labels: { 
                                boxWidth: 12, 
                                padding: 15, 
                                usePointStyle: true, 
                                font: {size: 12},
                                callback: function(label, chartData) {
                                    const dataset = chartData.datasets[0];
                                    const index = chartData.labels.indexOf(label);
                                    const value = dataset.data[index];
                                    return label + " (" + value + "%)";
                                }
                            } 
                        } 
                    } 
                }
            });

            if (selectHealth) {
                selectHealth.innerHTML = '<option value="GLOBAL">Global</option>';

                reportes.forEach((repo, index) => {
                    let opt = document.createElement('option');
                    opt.value = index; 
                    let n = repo.nombreProyecto;
                    opt.textContent = n.length > 25 ? n.substring(0, 25) + '...' : n; 
                    selectHealth.appendChild(opt);
                });

                selectHealth.addEventListener('change', function() {
                    const val = this.value;
                    let newData = [];
                    let newRaw = [];

                    if (val === 'GLOBAL') {
                        newData = [datosEstadoGlobal.onTimePercentage, datosEstadoGlobal.latePercentage, datosEstadoGlobal.needsActionPercentage, datosEstadoGlobal.decisionPercentage];
                        newRaw = [datosEstadoGlobal.onTimeCount, datosEstadoGlobal.delayedCount, datosEstadoGlobal.escalationCount, datosEstadoGlobal.decisionCount || 0];
                    } else {
                        const repo = reportes[val];
                        const total = repo.onTimeCount + repo.lateCount + repo.needsActionCount + repo.decisionCount;
                        newRaw = [repo.onTimeCount, repo.lateCount, repo.needsActionCount, repo.decisionCount];
                        if (total > 0) {
                            newData = [
                                Math.round((repo.onTimeCount / total) * 100),
                                Math.round((repo.lateCount / total) * 100),
                                Math.round((repo.needsActionCount / total) * 100),
                                Math.round((repo.decisionCount / total) * 100)
                            ];
                        } else {
                            newData = [0, 0, 0, 0];
                        }
                    }

                    chartVolumenInstance.data.datasets[0].data = newData;
                    chartVolumenInstance.data.datasets[0].rawCounts = newRaw;
                    chartVolumenInstance.update();
                });
            }
        }

        //4. MEDIDOR DE RIESGO INDIVIDUAL
        const ctxRiesgo = document.getElementById('chartRiesgo');
        const selectRiesgo = document.getElementById('selectRiesgoProyecto');

        if (ctxRiesgo) {
            let currentRiskScore = 0;
            
            function getRiskProps(score, isDefault) {
                if (isDefault) return { color: '#e2e8f0', label: 'SIN SELECCIÓN' }; 
                if (score >= 50) return { color: '#ef4444', label: 'ALTO RIESGO' };
                if (score >= 20) return { color: '#f59e0b', label: 'RIESGO MEDIO' };
                return { color: '#10b981', label: 'BAJO RIESGO' };
            }

            let initProps = getRiskProps(currentRiskScore, true);
            let currentRiskColor = initProps.color;
            let currentRiskLabel = initProps.label;

            const gaugeTextPlugin = {
                id: 'gaugeText',
                beforeDraw: function(chart) {
                    const { width, height, ctx } = chart;
                    ctx.save();
                    ctx.font = "900 36px 'Inter', sans-serif"; 
                    ctx.fillStyle = currentRiskColor;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    
                    let textValue = currentRiskScore === 0 && selectRiesgo.value === "" ? "--%" : currentRiskScore + "%";
                    
                    ctx.fillText(textValue, width / 2, height - 40);
                    ctx.font = "bold 14px 'Inter', sans-serif";
                    ctx.fillStyle = "#64748b";
                    ctx.fillText(currentRiskLabel, width / 2, height - 10);
                    ctx.restore();
                }
            };

            chartRiesgoInstance = new Chart(ctxRiesgo, {
                type: 'doughnut',
                data: {
                    labels: ['Riesgo', 'Seguro'],
                    datasets: [{
                        data: [currentRiskScore, 100], 
                        backgroundColor: [currentRiskColor, '#f1f5f9'], 
                        borderWidth: 0, borderRadius: 5,
                    }]
                },
                plugins: [gaugeTextPlugin],
                options: {
                    responsive: true, maintainAspectRatio: false, circumference: 180, rotation: 270, cutout: '80%', 
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    animation: { animateRotate: true, animateScale: false }
                }
            });

            if (selectRiesgo) {
                selectRiesgo.innerHTML = '<option value="" selected disabled>Seleccione un proyecto</option>';

                reportes.forEach((repo, index) => {
                    let opt = document.createElement('option');
                    opt.value = index; 
                    let n = repo.nombreProyecto;
                    opt.textContent = n.length > 25 ? n.substring(0, 25) + '...' : n; 
                    selectRiesgo.appendChild(opt);
                });

                selectRiesgo.addEventListener('change', function() {
                    const val = this.value;

                    let riesgoInd = reportes[val].riesgo;
                    currentRiskScore = (riesgoInd !== undefined && riesgoInd !== null) ? parseFloat(riesgoInd.toFixed(1)) : 0; 

                    let newProps = getRiskProps(currentRiskScore, false);
                    currentRiskColor = newProps.color;
                    currentRiskLabel = newProps.label;

                    chartRiesgoInstance.data.datasets[0].data = [currentRiskScore, 100 - currentRiskScore];
                    chartRiesgoInstance.data.datasets[0].backgroundColor = [currentRiskColor, '#f1f5f9'];
                    chartRiesgoInstance.update();
                });
            }
        }

        // INICIALIZAR LA MATRIZ MAESTRA AL CARGAR
        function initMasterTimeline() {
            const tbody = document.getElementById('masterTimelineBody');
            if (!tbody || !reportes || reportes.length === 0) return;

            tbody.innerHTML = ''; 
            const now = new Date();

            reportes.forEach(proyecto => {
                const tr = document.createElement('tr');
                tr.className = 'transit-row';
                
                // Columna Nombre Proyecto
                const tdNombre = document.createElement('td');
                tdNombre.className = 'ps-4 py-4 fw-bold text-dark';
                tdNombre.style.fontSize = '0.9rem';
                tdNombre.innerText = proyecto.nombreProyecto;
                tr.appendChild(tdNombre);

                // Crear 12 celdas para los meses
                for (let i = 0; i < 12; i++) {
                    const tdMonth = document.createElement('td');
                    tdMonth.className = 'text-center';
                    tdMonth.style.height = '160px'; // Aumentamos más la altura
                    tr.appendChild(tdMonth);
                }

                // Diccionario para rastrear cuántos iconos hay por mes en ESTA fila
                const monthStackCount = {};

                function getIconYOffset(monthIndex) {
                    const count = monthStackCount[monthIndex] || 0;
                    monthStackCount[monthIndex] = count + 1;
                    
                    // Lógica de apilamiento alternado: 0, -45, 45, -90, 90...
                    if (count === 0) return 0;
                    const direction = (count % 2 === 0) ? 1 : -1;
                    const magnitude = Math.ceil(count / 2) * 45; // Mayor espacio entre iconos
                    return direction * magnitude;
                }

                // Lógica de Tránsito (Barco -> Fábrica)
                if (proyecto.fechaTransit && proyecto.fechaTransit !== "null") {
                    const shipDate = new Date(proyecto.fechaTransit);
                    if (!isNaN(shipDate.getTime())) {
                        const factoryDate = new Date(shipDate);
                        factoryDate.setDate(factoryDate.getDate() + 60);

                        const shipMonth = shipDate.getMonth();
                        const factoryMonth = factoryDate.getMonth();

                        const currentYear = new Date().getFullYear();
                        if (shipDate.getFullYear() === currentYear || factoryDate.getFullYear() === currentYear) {
                            const startX = 20 + (shipMonth * 6.66) + 3.33;
                            const endX = 20 + (factoryMonth * 6.66) + 3.33;
                            
                            // Track y Ship/Factory no se apilan con el resto para mantener la línea recta
                            const track = document.createElement('div');
                            track.className = 'transit-track';
                            track.style.left = startX + '%';
                            track.style.width = (endX - startX) + '%';
                            tr.appendChild(track);

                            const factoryImg = document.createElement('div');
                            factoryImg.className = 'factory-destination';
                            factoryImg.innerHTML = '🏭';
                            factoryImg.style.left = endX + '%';
                            factoryImg.style.cursor = 'pointer';
                            factoryImg.style.zIndex = '10'; // Fábrica arriba de todo
                            factoryImg.onclick = () => {
                                document.getElementById('hitoIconContainer').innerText = '🏭';
                                document.getElementById('hitoNombre').innerText = 'Arrival at Factory (Estimated)';
                                document.getElementById('hitoFechaExacta').innerText = factoryDate.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                                new bootstrap.Modal(document.getElementById('modalHitoDetalle')).show();
                            };
                            tr.appendChild(factoryImg);

                            const shipImg = document.createElement('div');
                            shipImg.className = 'ship-moving';
                            shipImg.innerHTML = '🚢';
                            shipImg.style.zIndex = '10'; // Barco arriba de todo
                            let progressPercent = 0;
                            if (now >= factoryDate) progressPercent = 100;
                            else if (now > shipDate) progressPercent = ((now - shipDate) / (factoryDate - shipDate)) * 100;
                            
                            const currentX = startX + ((endX - startX) * (progressPercent / 100));
                            shipImg.style.left = currentX + '%';
                            shipImg.onclick = () => {
                                document.getElementById('hitoIconContainer').innerText = '🚢';
                                document.getElementById('hitoNombre').innerText = 'Equipment Ship & Transit';
                                document.getElementById('hitoFechaExacta').innerText = `Departure: ${shipDate.toLocaleDateString()} \n Est. Arrival: ${factoryDate.toLocaleDateString()}`;
                                new bootstrap.Modal(document.getElementById('modalHitoDetalle')).show();
                            };
                            tr.appendChild(shipImg);
                            
                            // IMPORTANTE: Marcamos estos meses como que ya tienen un icono en el CENTRO (pos 0)
                            monthStackCount[shipMonth] = 1;
                            monthStackCount[factoryMonth] = 1;
                        }
                    }
                }

                // Ubicar otros hitos (CAR, Buy-off)
                const otherMilestones = [
                    { key: 'car', name: 'CAR Approval', icon: '💰', date: proyecto.fechaCar },
                    { key: 'buyoff', name: 'Line Buy-off', icon: '👥', date: proyecto.fechaBuyoff }
                ];

                otherMilestones.forEach(m => {
                    if (m.date && m.date !== "null" && m.date !== "N/A") {
                        const d = new Date(m.date);
                        if (!isNaN(d.getTime())) {
                            const month = d.getMonth();
                            const posX = 20 + (month * 6.66) + 3.33;
                            const yOffset = getIconYOffset(month);
                            
                            const iconEl = document.createElement('div');
                            iconEl.innerHTML = m.icon;
                            iconEl.style.position = 'absolute';
                            iconEl.style.left = posX + '%';
                            iconEl.style.top = `calc(50% + ${yOffset}px)`;
                            iconEl.style.transform = 'translate(-50%, -50%)';
                            iconEl.style.cursor = 'pointer';
                            iconEl.style.fontSize = '1.25rem';
                            iconEl.style.zIndex = '4';
                            iconEl.onclick = () => {
                                document.getElementById('hitoIconContainer').innerText = m.icon;
                                document.getElementById('hitoNombre').innerText = m.name;
                                document.getElementById('hitoFechaExacta').innerText = d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                                new bootstrap.Modal(document.getElementById('modalHitoDetalle')).show();
                            };
                            tr.appendChild(iconEl);
                        }
                    }
                });

                tbody.appendChild(tr);
            });
        }

        // Ejecutar al cargar
        document.addEventListener('DOMContentLoaded', () => {
            initMasterTimeline();
            
            // Establecer el año actual en el título
            const yearBadge = document.getElementById('currentYearBadge');
            if (yearBadge) yearBadge.textContent = new Date().getFullYear();
        });

        /*]]>*/
    </script>
</body>
</html>
