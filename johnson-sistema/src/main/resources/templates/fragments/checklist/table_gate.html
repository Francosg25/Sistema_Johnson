<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="table_gate(fase)">
    <div class="card glass-card">
        <div class="card-body p-0">
            <div th:if="${fase.id == 's3' or fase.id == 's4' or fase.id == 's5'}" class="bg-light border-bottom p-3 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="icon-box bg-primary bg-opacity-10 text-primary me-3 rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                        <i class="bi bi-patch-check-fill fs-4"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-0 text-dark">Gate Sealing & Approvals</h6>
                        <p class="small text-muted mb-0">Cross-functional validation and project milestone closure.</p>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <!-- QE Signature -->
                    <div class="mini-signature-box" 
                         th:with="firma=${fase.firmas.get('QE')}"
                         th:classappend="${firma != null ? 'signed' : 'unsigned btn-firmar-trigger'}"
                         th:data-proyecto="${proyecto.id}" th:data-etapa="${fase.id == 's3' ? 3 : (fase.id == 's4' ? 4 : 5)}" th:data-rol="'QE'"
                         th:class="${firma != null ? 'mini-signature-box signed btn-firmado-trigger' : 'mini-signature-box unsigned btn-firmar-trigger'}"
                         th:attr="data-firmante=${firma != null ? firma.usuario : ''}, data-fecha=${firma != null ? #temporals.format(firma.fechaFirma, 'dd/MM/yyyy HH:mm') : ''}">
                        <div class="small fw-bold text-uppercase" style="font-size: 0.65rem;">QE Approval</div>
                        <div th:if="${firma == null}" class="small text-muted"><i class="bi bi-pen me-1"></i>Sign</div>
                        <div th:if="${firma != null}" class="small text-success fw-bold"><i class="bi bi-check-all me-1"></i>OK</div>
                    </div>

                    <!-- DE Signature -->
                    <div class="mini-signature-box" 
                         th:with="firma=${fase.firmas.get('DE')}"
                         th:classappend="${firma != null ? 'signed' : 'unsigned btn-firmar-trigger'}"
                         th:data-proyecto="${proyecto.id}" th:data-etapa="${fase.id == 's3' ? 3 : (fase.id == 's4' ? 4 : 5)}" th:data-rol="'DE'"
                         th:class="${firma != null ? 'mini-signature-box signed btn-firmado-trigger' : 'mini-signature-box unsigned btn-firmar-trigger'}"
                         th:attr="data-firmante=${firma != null ? firma.usuario : ''}, data-fecha=${firma != null ? #temporals.format(firma.fechaFirma, 'dd/MM/yyyy HH:mm') : ''}">
                        <div class="small fw-bold text-uppercase" style="font-size: 0.65rem;">DE Approval</div>
                        <div th:if="${firma == null}" class="small text-muted"><i class="bi bi-pen me-1"></i>Sign</div>
                        <div th:if="${firma != null}" class="small text-success fw-bold"><i class="bi bi-check-all me-1"></i>OK</div>
                    </div>

                    <!-- PE Signature -->
                    <div class="mini-signature-box" 
                         th:with="firma=${fase.firmas.get('PE')}"
                         th:classappend="${firma != null ? 'signed' : 'unsigned btn-firmar-trigger'}"
                         th:data-proyecto="${proyecto.id}" th:data-etapa="${fase.id == 's3' ? 3 : (fase.id == 's4' ? 4 : 5)}" th:data-rol="'PE'"
                         th:class="${firma != null ? 'mini-signature-box signed btn-firmado-trigger' : 'mini-signature-box unsigned btn-firmar-trigger'}"
                         th:attr="data-firmante=${firma != null ? firma.usuario : ''}, data-fecha=${firma != null ? #temporals.format(firma.fechaFirma, 'dd/MM/yyyy HH:mm') : ''}">
                        <div class="small fw-bold text-uppercase" style="font-size: 0.65rem;">PE Approval</div>
                        <div th:if="${firma == null}" class="small text-muted"><i class="bi bi-pen me-1"></i>Sign</div>
                        <div th:if="${firma != null}" class="small text-success fw-bold"><i class="bi bi-check-all me-1"></i>OK</div>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover table-bordered mb-0 align-middle" style="font-size: 0.85rem;">
                    <thead class="bg-light small text-uppercase text-muted fw-bold">
                        <tr>
                            <th style="width: 5%;" class="text-center">#</th>
                            <th style="width: 35%;">Requirement / Validation Point</th>
                            <th style="width: 15%;" class="text-center">Compliance (Yes/No/NA)</th>
                            <th style="width: 40%;">Remarks / Observations</th>
                            <th class="text-center" style="width: 50px;">
                                <i class="bi bi-paperclip fs-5 text-secondary"></i>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <th:block th:each="item, iterStat : ${fase.items}">
                            <tr th:if="${iterStat.index == 0 or !fase.items[iterStat.index - 1].grupo.equals(item.grupo)}" class="table-group-header">
                                <td colspan="5" class="fw-bold text-uppercase py-2 px-3 text-dark">
                                    <i class="bi bi-layers-half me-2 text-primary"></i><span th:text="${item.grupo}"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-center text-muted fw-bold" th:text="${item.codigo}"></td>
                                <td class="fw-bold text-dark" th:text="${item.nombre}"></td>
                                <td class="text-center">
                                    <select class="form-select form-select-sm border-0 fw-bold text-center" 
                                            th:name="'estado-' + ${item.id}"
                                            th:classappend="${item.estado == 'OK' ? 'status-on-time' : (item.estado == 'NOK' ? 'status-late' : 'status-default')}">
                                        <option value="" th:selected="${item.estado == '' || item.estado == null}"></option>
                                        <option value="OK" th:selected="${item.estado == 'OK'}">YES</option>
                                        <option value="NOK" th:selected="${item.estado == 'NOK'}">NO</option>
                                        <option value="N/A" th:selected="${item.estado == 'N/A'}">N/A</option>
                                    </select>
                                </td>
                                <td>
                                    <div class="d-flex justify-content-between align-items-center bg-white bg-opacity-50 rounded p-1 border shadow-sm"
                                         style="cursor: pointer; transition: 0.2s;" onmouseover="this.style.borderColor='#80bdff'" onmouseout="this.style.borderColor='#dee2e6'" th:onclick="abrirEditorComentarios([[${item.id}]], [[${item.codigo}]])">
                                        <div class="text-truncate small ms-2 w-100" th:id="'preview-comentario-' + ${item.id}"
                                             th:classappend="${item.comentario == null or item.comentario.isEmpty() ? 'text-muted fst-italic' : 'text-dark fw-bold'}"
                                             th:text="${item.comentario == null or item.comentario.isEmpty() ? '' : item.comentario}">
                                        </div>
                                        <button type="button" 
                                                th:id="'btn-comentario-' + ${item.id}"
                                                th:class="${item.comentario != null and !item.comentario.empty} ? 
                                                          'btn btn-sm btn-primary border-0 rounded-circle ms-1 shadow-sm flex-shrink-0' : 
                                                          'btn btn-sm btn-light text-secondary border-0 rounded-circle ms-1 shadow-sm flex-shrink-0'"
                                                th:attr="onclick=|abrirEditorComentarios('${item.id}', '${item.codigo}')|">
                                            <i th:id="'btn-icon-comentario-' + ${item.id}" 
                                               th:class="${item.comentario != null and !item.comentario.empty} ? 'bi bi-chat-text-fill' : 'bi bi-pencil'"></i>
                                        </button>
                                    </div>
                                    <textarea class="d-none" th:name="'comentario-' + ${item.id}" th:id="'real-comentario-' + ${item.id}" th:text="${item.comentario}"></textarea>
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-sm border shadow-sm rounded-circle" 
                                            th:id="'btn-evidencia-' + ${item.id}"
                                            th:classappend="${item.adjuntos != null and !item.adjuntos.isEmpty()} ? 'btn-primary' : 'btn-light'"
                                            data-bs-toggle="modal" 
                                            th:data-bs-target="'#modalEvidencia_' + ${item.id}"
                                            title="Upload/View Evidence">
                                        <i th:id="'btn-icon-evidencia-' + ${item.id}" class="bi bi-cloud-arrow-up-fill" th:classappend="${item.adjuntos != null and !item.adjuntos.isEmpty()} ? 'text-white' : 'text-primary'"></i>
                                    </button>
                                </td>
                            </tr>
                        </th:block>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
