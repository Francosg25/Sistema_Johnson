<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper"><div th:replace="~{fragments/sidebar :: sidebar(currentUri='reportes')}"></div></div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>

            <main class="container-fluid p-4">
                <h3 class="fw-bold text-dark mb-4">Reportes de Progreso APQP</h3>

                <div class="row g-4 mb-5">
                    <div class="col-md-3" th:each="dato, stat : ${datosGrafica}">
                        <div class="card border-0 shadow-sm h-100 border-start border-4"
                             th:style="'border-color: ' + (${stat.index % 5 == 0 ? '#74B9FF' : 
                                                            (stat.index % 5 == 1 ? '#77DD77' : 
                                                            (stat.index % 5 == 2 ? '#FFB347' : 
                                                            (stat.index % 5 == 3 ? '#FF6961' : '#B19CD9')))}) + ' !important;'">
                            <div class="card-body">
                                <h6 class="text-muted text-uppercase small fw-bold" th:text="${dato.nombreProyecto}">PROYECTO</h6>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <h2 class="fw-bold mb-0 text-dark">
                                        <span th:text="${dato.porcentaje}">0</span>%
                                    </h2>
                                    <span class="badge bg-light text-secondary border">
                                        <span th:text="${dato.completados}">0</span>/<span th:text="${dato.totalEntregables}">0</span>
                                    </span>
                                </div>
                                <div class="progress mt-3" style="height: 6px;">
                                    <div class="progress-bar" role="progressbar" 
                                         th:style="'width: ' + ${dato.porcentaje} + '%; background-color: ' + 
                                                   (${stat.index % 5 == 0 ? '#74B9FF' : 
                                                    (stat.index % 5 == 1 ? '#77DD77' : 
                                                    (stat.index % 5 == 2 ? '#FFB347' : 
                                                    (stat.index % 5 == 3 ? '#FF6961' : '#B19CD9')))}) + ' !important;'">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white py-3">
                                <h6 class="m-0 fw-bold text-primary"><i class="bi bi-bar-chart-fill me-2"></i>Comparativa de Avance (%)</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartProgreso"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white py-3">
                                <h6 class="m-0 fw-bold text-primary"><i class="bi bi-pie-chart-fill me-2"></i>Porcentaje de Entregables por Estado</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartVolumen"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        
        var reportes = /*[[${datosGrafica}]]*/ [];
        var datosEstadoGlobal = /*[[${datosEstadoGlobal}]]*/ null;

        var nombres = reportes.map(r => r.nombreProyecto);
        var porcentajes = reportes.map(r => r.porcentaje);

        const paletaColores = ['#74B9FF', '#77DD77', '#FFB347', '#FF6961', '#B19CD9'];
        const paletaBordes = ['#0984E3', '#00B894', '#E17055', '#D63031', '#6C5CE7'];

        const coloresBarras = nombres.map((_, index) => paletaColores[index % 5]);
        const coloresBordesBarras = nombres.map((_, index) => paletaBordes[index % 5]);

        const ctx1 = document.getElementById('chartProgreso');
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: nombres,
                datasets: [{
                    label: '% Completado',
                    data: porcentajes,
                    backgroundColor: coloresBarras,       // Usamos el arreglo de colores dinámico
                    borderColor: coloresBordesBarras,     // Usamos el arreglo de bordes dinámico
                    borderWidth: 1,
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, max: 100 }
                }
            }
        });

        const ctx2 = document.getElementById('chartVolumen');
        if (datosEstadoGlobal) {
            new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['ON TIME', 'LATE', 'NEEDS ACTION', 'DECISION'],
                    datasets: [{
                        label: 'Porcentaje de Entregables',
                        data: [
                            datosEstadoGlobal.onTimePercentage,
                            datosEstadoGlobal.latePercentage,
                            datosEstadoGlobal.needsActionPercentage,
                            datosEstadoGlobal.decisionPercentage
                        ],
                        backgroundColor: [
                            '#77DD77', // Verde (ON TIME)
                            '#FF6961', // Rojo (LATE)
                            '#FFB347', // Naranja (NEEDS ACTION)
                            '#74B9FF'  // Azul (DECISION)
                        ],
                        borderColor: '#ffffff',
                        borderWidth: 2,
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: 'Porcentaje de Entregables por Estado Global'
                        }
                    }
                }
            });
        }

        /*]]>*/
    </script>
</body>
</html>
