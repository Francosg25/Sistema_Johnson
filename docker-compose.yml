services:
  db:
    image: postgres:15-alpine
    container_name: johnson_db
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5444:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]      
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s 

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: johnson_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
    volumes:
      - ./backups:/app/backups
      - ./evidencias:/app/evidencias
    restart: always

  nginx:
    image: nginx:alpine
    container_name: johnson_nginx
    depends_on:
      - app
    ports:
      - "80:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always