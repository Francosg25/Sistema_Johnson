<div th:fragment="sidebar(currentUri)" class="sidebar-je d-flex flex-column shadow-sm" style="width: 240px; min-height: 100vh;">
    
    <div class="brand-logo d-flex flex-column align-items-center">
        <span class="fw-black" style="font-weight: 900; font-size: 1.2rem; letter-spacing: -1px;">JOHNSON</span>
        <span class="light small" style="letter-spacing: 3px; font-weight: 300;">ELECTRIC</span>
    </div>

    <ul class="nav flex-column mb-auto w-100 mt-3">
        <li class="nav-item">
            <a th:href="@{/}" class="nav-link" th:classappend="${currentUri == '/' || currentUri == '/index' || currentUri == '/proyectos'} ? 'active' : ''">
                <i class="bi bi-grid-fill"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/timeline}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/timeline')} ? 'active' : ''">
                <i class="bi bi-calendar3-range"></i> Timeline
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/reportes}" class="nav-link" 
                th:classappend="${currentUri == 'reportes' or (currentUri != null and currentUri.startsWith('/reportes'))} ? 'active' : ''">
                <i class="bi bi-bar-chart-fill"></i> Reportes
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/evidencias}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/evidencias')} ? 'active' : ''">
                <i class="bi bi-archive-fill"></i> Evidencias
            </a>
        </li>
    </ul>

    <div class="sidebar-footer mt-auto">
        <div class="d-flex align-items-center">
            <div class="avatar-initial rounded-circle me-2">
                <span th:text="${#strings.substring(#authentication?.name != null ? #authentication.name : 'U', 0, 1).toUpperCase()}">U</span>
            </div>
            <div class="d-flex flex-column text-truncate" style="max-width: 150px;">
                <span class="fw-bold text-truncate" style="font-size: 0.85rem; line-height: 1.1;" th:text="${#authentication?.name ?: 'Invitado'}">Usuario</span>
                <form th:action="@{/logout}" method="post" class="m-0 p-0 mt-1">
                    <button type="submit" class="btn btn-link p-0 m-0 border-0 align-baseline text-decoration-none small text-warning fw-bold" style="font-size: 0.75rem;">
                        <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
