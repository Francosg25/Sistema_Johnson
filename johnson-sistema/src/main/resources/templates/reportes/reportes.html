<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* --- GLASSMORPHISM DECORATION --- */
        .bg-blob {
            position: fixed;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(245, 130, 31, 0.15) 0%, rgba(245, 130, 31, 0.05) 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }
        .blob-1 { top: -100px; right: -100px; }
        .blob-2 { bottom: -100px; left: -100px; background: linear-gradient(135deg, rgba(13, 110, 253, 0.12) 0%, rgba(13, 110, 253, 0.05) 100%); }

        /* --- GLASS CARDS --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.6) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            border-radius: 20px !important;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07) !important;
            overflow: hidden;
            height: 100%;
        }
        
        .premium-header {
            background: rgba(255, 255, 255, 0.3) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;
            padding: 1.25rem 1.5rem;
        }

        .premium-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #2b3035;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
        }
        .premium-icon {
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(63, 106, 216, 0.1);
            color: #3f6ad8;
            margin-right: 12px;
            font-size: 1.1rem;
        }
        
        .chart-container {
            position: relative;
            padding: 1.5rem;
            width: 100%;
        }
        .waterfall-container {
            overflow-y: auto; 
            overflow-x: hidden;
            padding-right: 10px;
        }
        .waterfall-container::-webkit-scrollbar { width: 8px; }
        .waterfall-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .waterfall-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .waterfall-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper"><div th:replace="~{fragments/sidebar :: sidebar(currentUri='reportes')}"></div></div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>

            <main class="container-fluid p-4">

                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card glass-card">
                            <div class="card-header premium-header">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-water premium-icon"></i>
                                    Progress by Stage and Project                                
                                </h6>
                            </div>
                            <div class="card-body waterfall-container" style="max-height: 600px;">
                                <div id="cascadaInnerContainer" style="position: relative; width: 100%;">
                                    <canvas id="chartCascada"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card glass-card">
                            <div class="card-header premium-header">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-bar-chart-fill premium-icon" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6;"></i>
                                    Global Progress Comparation (%)
                                </h6>
                            </div>
                            <div class="card-body chart-container" style="height: 400px;">
                                <canvas id="chartProgreso"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-5">
                    
                    <div class="col-md-6">
                        <div class="card glass-card">
                            <div class="card-header premium-header">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-pie-chart-fill premium-icon" style="background: rgba(16, 185, 129, 0.1); color: #10b981;"></i>
                                    Health Task
                                </h6>
                            </div>
                            <div class="card-body chart-container d-flex align-items-center justify-content-center" style="height: 350px;">
                                <canvas id="chartVolumen" style="max-height: 280px;"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card glass-card">
                            <div class="card-header premium-header d-flex justify-content-between align-items-center">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-speedometer2 premium-icon" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;"></i>
                                    Risk Meter
                                </h6>
                                <select id="selectRiesgoProyecto" class="form-select form-select-sm border-0 bg-light fw-bold text-secondary shadow-none" style="width: auto; max-width: 600px; cursor: pointer;">
                                    <option value="GLOBAL">Global</option>
                                </select>
                            </div>
                            <div class="card-body chart-container d-flex align-items-center justify-content-center flex-column pb-4" style="height: 350px;">
                                <canvas id="chartRiesgo" style="max-height: 250px;"></canvas>
                            </div>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        
        var reportes = /*[[${datosGrafica}]]*/ [];
        var datosEstadoGlobal = /*[[${datosEstadoGlobal}]]*/ null;
        var datosCascada = /*[[${datosCascada}]]*/ []; 

        var nombres = reportes.map(r => r.nombreProyecto);
        var porcentajes = reportes.map(r => r.porcentaje);

        let chartProgresoInstance = null;
        let chartCascadaInstance = null;
        let chartVolumenInstance = null;
        let chartRiesgoInstance = null;
      
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.font.size = 13; 
        Chart.defaults.color = '#64748b'; 
        
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(15, 23, 42, 0.95)';
        Chart.defaults.plugins.tooltip.titleFont = { size: 14, weight: 'bold' };
        Chart.defaults.plugins.tooltip.bodyFont = { size: 13 };
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
        Chart.defaults.plugins.tooltip.usePointStyle = true;

        const paletteWaterfall = ['#3b82f6', '#0ea5e9', '#10b981', '#f59e0b', '#8b5cf6'];
        const paletteStatus = ['#10b981', '#ef4444', '#f59e0b', '#3b82f6']; 

        //1. GRAFICA DE BARRAS 
        const ctx1 = document.getElementById('chartProgreso');
        if(ctx1 && nombres.length > 0) {
            const context1 = ctx1.getContext('2d');
            let gradientBlue = context1.createLinearGradient(0, 0, 0, 400);
            gradientBlue.addColorStop(0, 'rgba(59, 130, 246, 1)');   
            gradientBlue.addColorStop(1, 'rgba(59, 130, 246, 0.1)'); 

            chartProgresoInstance = new Chart(context1, {
                type: 'bar',
                data: {
                    labels: nombres,
                    datasets: [{
                        label: 'Avance %',
                        data: porcentajes,
                        backgroundColor: gradientBlue,
                        borderColor: '#3b82f6',
                        borderWidth: 1,
                        borderRadius: { topLeft: 6, topRight: 6 },
                        barPercentage: 0.6, 
                        categoryPercentage: 0.8
                    }]
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    return nombres[context[0].dataIndex];
                                }
                            }
                        }
                    },
                    scales: { 
                        y: { beginAtZero: true, max: 100, border: { display: false }, ticks: { callback: v => v + '%' } },
                        x: { 
                            grid: { display: false }, 
                            border: { display: false },
                            ticks: {
                                maxRotation: 0, 
                                minRotation: 0,
                                font: { size: 13 },
                                callback: function(value, index, values) {
                                    let label = nombres[index] || '';
                                    return label.length > 40 ? label.substring(0, 25) + '..' : label;
                                }
                            }
                        }
                    }
                }
            });
        }

        //2. GRAFICA CASCADA 
        const ctxCascada = document.getElementById('chartCascada');
        if (ctxCascada && datosCascada.length > 0) {
            
            const alturaMinimaPorBarra = 120; 
            const alturaCalculada = Math.max(datosCascada.length * alturaMinimaPorBarra, 350);
            document.getElementById('cascadaInnerContainer').style.height = alturaCalculada + 'px';

            const projectNamesCascada = datosCascada.map(d => {
                let n = d.nombreProyecto;
                return n.length > 25 ? n.substring(0, 25) + '...' : n;
            });
            const sopsCascada = datosCascada.map(d => d.sop); 
            const s1Data = [], s2Data = [], s3Data = [], s4Data = [], s5Data = [], totalData = [];

            datosCascada.forEach(d => {
                const capped = d.porcentajesPorFase.map(pct => Math.min(pct, 100));
                let p1 = Math.min((capped[0] || 0) / 5, 20); let p2 = Math.min((capped[1] || 0) / 5, 20);
                let p3 = Math.min((capped[2] || 0) / 5, 20); let p4 = Math.min((capped[3] || 0) / 5, 20);
                let p5 = Math.min((capped[4] || 0) / 5, 20);
                let end1 = p1; let end2 = end1 + p2; let end3 = end2 + p3; let end4 = end3 + p4; let end5 = end4 + p5;

                s1Data.push(p1 > 0 ? [0, end1] : null); s2Data.push(p2 > 0 ? [end1, end2] : null);
                s3Data.push(p3 > 0 ? [end2, end3] : null); s4Data.push(p4 > 0 ? [end3, end4] : null);
                s5Data.push(p5 > 0 ? [end4, end5] : null); totalData.push([0, end5]); 
            });

            chartCascadaInstance = new Chart(ctxCascada, {
                type: 'bar',
                data: {
                    labels: projectNamesCascada,
                    datasets: [
                        { label: 'STAGE 1', data: s1Data, backgroundColor: paletteWaterfall[0], borderRadius: 4, barPercentage: 0.8, realPct: datosCascada.map(d => d.porcentajesPorFase[0]) }, 
                        { label: 'STAGE 2', data: s2Data, backgroundColor: paletteWaterfall[1], borderRadius: 4, barPercentage: 0.8, realPct: datosCascada.map(d => d.porcentajesPorFase[1]) },
                        { label: 'STAGE 3', data: s3Data, backgroundColor: paletteWaterfall[2], borderRadius: 4, barPercentage: 0.8, realPct: datosCascada.map(d => d.porcentajesPorFase[2]) },
                        { label: 'STAGE 4', data: s4Data, backgroundColor: paletteWaterfall[3], borderRadius: 4, barPercentage: 0.8, realPct: datosCascada.map(d => d.porcentajesPorFase[3]) },
                        { label: 'STAGE 5', data: s5Data, backgroundColor: paletteWaterfall[4], borderRadius: 4, barPercentage: 0.8, realPct: datosCascada.map(d => d.porcentajesPorFase[4]) },
                        { label: 'TOTAL',   data: totalData, backgroundColor: '#cbd5e1', borderRadius: 4, barPercentage: 0.8, realPct: reportes.map(r => r.porcentaje) }
                    ]
                },
                plugins: [{
                    id: 'sopLabels',
                    afterDatasetsDraw(chart) {
                        const { ctx, data } = chart;
                        const totalDatasetIndex = data.datasets.findIndex(ds => ds.label === 'TOTAL');
                        if (totalDatasetIndex === -1) return;
                        const meta = chart.getDatasetMeta(totalDatasetIndex);
                        ctx.save(); ctx.textBaseline = 'middle';
                        meta.data.forEach((bar, index) => {
                            if(!sopsCascada[index]) return; 
                            const textoSOP = "SOP: " + sopsCascada[index];
                            ctx.font = 'bold 11px Inter, sans-serif'; 
                            const textWidth = ctx.measureText(textoSOP).width;
                            ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
                            ctx.beginPath(); ctx.roundRect(bar.x + 12, bar.y - 12, textWidth + 12, 24, 6); ctx.fill();
                            ctx.fillStyle = '#ef4444'; ctx.fillText(textoSOP, bar.x + 18, bar.y);
                        });
                        ctx.restore();
                    }
                }, {
                    id: 'barLabels',
                    afterDatasetsDraw(chart) {
                        const { ctx, data } = chart;
                        ctx.save();
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.font = 'bold 10px Inter, sans-serif';

                        chart.data.datasets.forEach((dataset, i) => {
                            if (dataset.label === 'TOTAL') return;
                            const meta = chart.getDatasetMeta(i);
                            meta.data.forEach((bar, index) => {
                                const val = dataset.realPct && dataset.realPct[index];
                                if (val > 0 && bar.width > 10) { 
                                    ctx.fillStyle = '#ffffff';
                                    // Use bar.x as the end and width/2 to center
                                    ctx.fillText(Math.round(val) + '%', bar.x - (bar.width / 2), bar.y);
                                }
                            });
                        });
                        ctx.restore();
                    }
                }],
                options: { 
                    indexAxis: 'y', 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    layout: { padding: { right: 130 } }, 
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const dataset = context.dataset;
                                    const index = context.dataIndex;
                                    const val = dataset.realPct[index];
                                    return dataset.label + ': ' + (val ? val.toFixed(1) : '0') + '%';
                                }
                            }
                        }
                    },
                    scales: { 
                        x: { max: 100, border: { display: false }, ticks: { callback: v => v + '%' } }, 
                        y: { grid: { display: false }, border: { display: false }, ticks: { font: { weight: 'bold', color: '#334155', size: 12 } } } 
                    },
                    interaction: { mode: 'y' } 
                }
            });
        }
   
        //3. GRAFICA DONA 
        const ctx3 = document.getElementById('chartVolumen');
        if (ctx3 && datosEstadoGlobal) {
            chartVolumenInstance = new Chart(ctx3, {
                type: 'doughnut',
                data: {
                    labels: ['ON TIME', 'LATE', 'NEEDS ACTION', 'DECISION'],
                    datasets: [{
                        data: [datosEstadoGlobal.onTimePercentage, datosEstadoGlobal.latePercentage, datosEstadoGlobal.needsActionPercentage, datosEstadoGlobal.decisionPercentage],
                        backgroundColor: paletteStatus, borderWidth: 0, borderRadius: 4, spacing: 2, hoverOffset: 8
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, cutout: '75%', 
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15, usePointStyle: true, font: {size: 12} } } } 
                }
            });
        }

        //4. MEDIDOR DE RIESGO INDIVIDUAL
        const ctxRiesgo = document.getElementById('chartRiesgo');
        const selectRiesgo = document.getElementById('selectRiesgoProyecto');

        if (ctxRiesgo) {
            let currentRiskScore = 0;
            
            function getRiskProps(score, isDefault) {
                if (isDefault) return { color: '#e2e8f0', label: 'SIN SELECCIÓN' }; 
                if (score >= 50) return { color: '#ef4444', label: 'ALTO RIESGO' };
                if (score >= 20) return { color: '#f59e0b', label: 'RIESGO MEDIO' };
                return { color: '#10b981', label: 'BAJO RIESGO' };
            }

            let initProps = getRiskProps(currentRiskScore, true);
            let currentRiskColor = initProps.color;
            let currentRiskLabel = initProps.label;

            const gaugeTextPlugin = {
                id: 'gaugeText',
                beforeDraw: function(chart) {
                    const { width, height, ctx } = chart;
                    ctx.save();
                    ctx.font = "900 36px 'Inter', sans-serif"; 
                    ctx.fillStyle = currentRiskColor;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    
                    let textValue = currentRiskScore === 0 && selectRiesgo.value === "" ? "--%" : currentRiskScore + "%";
                    
                    ctx.fillText(textValue, width / 2, height - 40);
                    ctx.font = "bold 14px 'Inter', sans-serif";
                    ctx.fillStyle = "#64748b";
                    ctx.fillText(currentRiskLabel, width / 2, height - 10);
                    ctx.restore();
                }
            };

            chartRiesgoInstance = new Chart(ctxRiesgo, {
                type: 'doughnut',
                data: {
                    labels: ['Riesgo', 'Seguro'],
                    datasets: [{
                        data: [currentRiskScore, 100], 
                        backgroundColor: [currentRiskColor, '#f1f5f9'], 
                        borderWidth: 0, borderRadius: 5,
                    }]
                },
                plugins: [gaugeTextPlugin],
                options: {
                    responsive: true, maintainAspectRatio: false, circumference: 180, rotation: 270, cutout: '80%', 
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    animation: { animateRotate: true, animateScale: false }
                }
            });

            if (selectRiesgo) {
                selectRiesgo.innerHTML = '<option value="" selected disabled>Seleccione un proyecto</option>';

                reportes.forEach((repo, index) => {
                    let opt = document.createElement('option');
                    opt.value = index; 
                    let n = repo.nombreProyecto;
                    opt.textContent = n.length > 25 ? n.substring(0, 25) + '...' : n; 
                    selectRiesgo.appendChild(opt);
                });

                selectRiesgo.addEventListener('change', function() {
                    const val = this.value;

                    let riesgoInd = reportes[val].riesgo;
                    currentRiskScore = (riesgoInd !== undefined && riesgoInd !== null) ? parseFloat(riesgoInd.toFixed(1)) : 0; 

                    let newProps = getRiskProps(currentRiskScore, false);
                    currentRiskColor = newProps.color;
                    currentRiskLabel = newProps.label;

                    chartRiesgoInstance.data.datasets[0].data = [currentRiskScore, 100 - currentRiskScore];
                    chartRiesgoInstance.data.datasets[0].backgroundColor = [currentRiskColor, '#f1f5f9'];
                    chartRiesgoInstance.update();
                });
            }
        }
        /*]]>*/
    </script>
</body>
</html>
