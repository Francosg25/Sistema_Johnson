<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --je-primary-color: rgb(245, 120, 32); /* Johnson Electric orange */
            --je-primary-hover-color: rgb(200, 100, 20); /* Slightly darker orange for hover */
            --je-text-dark: #000000; /* Black for text */
            --je-background-light: #f8f9fa; /* Light subtle gray background */
            --je-dark-background: #212529; /* Dark background for elements that might need it */
        }
        body {
            background-color: var(--je-background-light); /* Light subtle gray background */
            display: flex; /* Use flexbox for vertical centering */
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Full viewport height */
            margin: 0;
        }
        .login-container {
            max-width: 420px; /* Slightly wider */
            width: 100%; /* Ensure it takes full width up to max-width */
            padding: 40px; /* More padding */
            border-radius: 12px; /* Softer corners */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); /* More prominent shadow */
            background-color: #ffffff; /* White background for the form itself */
            /* Remove margin: 100px auto; as flexbox handles centering */
        }
        .login-container h2 {
            color: var(--je-text-dark); /* Black for headings */
            margin-bottom: 30px; /* More space below heading */
        }
        .form-label {
            font-weight: 500; /* Slightly bolder labels */
            color: var(--je-text-dark); /* Black for labels */
        }
        .form-control {
            border-radius: 6px; /* Slightly rounded inputs */
            padding: 10px 15px; /* More vertical padding */
            border-color: #ced4da; /* Default Bootstrap border color */
        }
        .form-control:focus {
            border-color: var(--je-primary-color);
            box-shadow: 0 0 0 0.25rem rgba(245, 120, 32, 0.25); /* Adjusted shadow with custom orange color */
        }
        .btn-primary {
            background-color: var(--je-primary-color);
            border-color: var(--je-primary-color);
            border-radius: 6px; /* Match input radius */
            font-weight: 600; /* Bolder button text */
            padding: 10px 20px; /* More padding */
            color: #ffffff; /* White text for contrast on orange button */
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out; /* Smooth transition */
        }
        .btn-primary:hover {
            background-color: var(--je-primary-hover-color);
            border-color: var(--je-primary-hover-color);
        }
        .alert {
            border-radius: 6px; /* Match other elements */
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>
        <div th:if="${param.error}" class="alert alert-danger">
            Usuario o contraseña inválidos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            Has cerrado sesión correctamente.
        </div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Ingresa tu usuario" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
            </div>
        </form>
    </div>
</body>
</html>
