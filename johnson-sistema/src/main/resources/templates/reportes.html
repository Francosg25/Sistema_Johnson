<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper"><div th:replace="~{fragments/sidebar :: sidebar(currentUri='reportes')}"></div></div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>

                <div class="row g-4 mt-2 mb-5">
                    <div class="col-12">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white py-3">
                                <h6 class="m-0 fw-bold text-primary"><i class="bi bi-bar-chart-line me-2"></i>Progreso por Etapas y Proyectos</h6>
                            </div>
                            <div class="card-body">
                                <div style="min-height: 450px; height: 450px; width: 100%;">
                                    <canvas id="chartCascada"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white py-3">
                                <h6 class="m-0 fw-bold text-primary"><i class="bi bi-bar-chart-fill me-2"></i>Comparativa de Avance (%)</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartProgreso"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white py-3">
                                <h6 class="m-0 fw-bold text-primary"><i class="bi bi-pie-chart-fill me-2"></i>Porcentaje de Entregables por Estado</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartVolumen"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        
        var reportes = /*[[${datosGrafica}]]*/ [];
        var datosEstadoGlobal = /*[[${datosEstadoGlobal}]]*/ null;
        var datosCascada = /*[[${datosCascada}]]*/ []; 

        var nombres = reportes.map(r => r.nombreProyecto);
        var porcentajes = reportes.map(r => r.porcentaje);

        // Global Chart instances
        let chartProgresoInstance = null;
        let chartCascadaInstance = null;
        let chartVolumenInstance = null;
      
        const fuenteNativa = window.getComputedStyle(document.body).fontFamily;
        Chart.defaults.font.family = fuenteNativa;
        Chart.defaults.font.size = 13; 
        Chart.defaults.color = '#495057'; 
        Chart.defaults.devicePixelRatio = window.devicePixelRatio || 1;
        const paletaColores = ['#74B9FF', '#77DD77', '#FFB347', '#FF6961', '#B19CD9'];
        const paletaBordes = ['#0984E3', '#00B894', '#E17055', '#D63031', '#6C5CE7'];

        const coloresBarras = nombres.map((_, index) => paletaColores[index % 5]);
        const coloresBordesBarras = nombres.map((_, index) => paletaBordes[index % 5]);

        const ctx1 = document.getElementById('chartProgreso');
        if(ctx1) {
            chartProgresoInstance = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: nombres,
                    datasets: [{
                        label: '% Completado',
                        data: porcentajes,
                        backgroundColor: coloresBarras,
                        borderColor: coloresBordesBarras,
                        borderWidth: 1,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, max: 100 } }
                }
            });
        }

        // 2. GRÁFICA DE CASCADA (ESTILO ESCALERA / FLOATING BARS)
        const projectNamesCascada = datosCascada.map(d => d.nombreProyecto);

        const s2Data = [];
        const s3Data = [];
        const s4Data = [];
        const s5Data = [];
        const totalData = [];

        datosCascada.forEach(d => {
            // Aseguramos que los porcentajes brutos del backend no excedan el 100%
            const cappedPorcentajesPorFase = d.porcentajesPorFase.map(pct => Math.min(pct, 100));

            console.log('Project: ', d.nombreProyecto, ' Raw percentages (JS-capped): ', cappedPorcentajesPorFase); // DEBUG LINE

            let p2 = (cappedPorcentajesPorFase[0] || 0) / 4;
            let p3 = (cappedPorcentajesPorFase[1] || 0) / 4;
            let p4 = (cappedPorcentajesPorFase[2] || 0) / 4;
            let p5 = (cappedPorcentajesPorFase[3] || 0) / 4;

            // Ensure pX values also don't exceed their maximum allowed contribution (25 each)
            p2 = Math.min(p2, 25);
            p3 = Math.min(p3, 25);
            p4 = Math.min(p4, 25);
            p5 = Math.min(p5, 25);

            let end2 = p2;
            let end3 = end2 + p3;
            let end4 = end3 + p4;
            let end5 = end4 + p5;

            s2Data.push(p2 > 0 ? [0, end2] : null);
            s3Data.push(p3 > 0 ? [end2, end3] : null);
            s4Data.push(p4 > 0 ? [end3, end4] : null);
            s5Data.push(p5 > 0 ? [end4, end5] : null);
            
            totalData.push([0, end5]); 
        });

        const cascadaDatasets = [
            { label: 'ETAPA 2', data: s2Data, backgroundColor: paletaColores[0], borderRadius: 3 },
            { label: 'ETAPA 3', data: s3Data, backgroundColor: paletaColores[1], borderRadius: 3 },
            { label: 'ETAPA 4', data: s4Data, backgroundColor: paletaColores[2], borderRadius: 3 },
            { label: 'ETAPA 5', data: s5Data, backgroundColor: paletaColores[3], borderRadius: 3 },
            { label: 'TOTAL',   data: totalData, backgroundColor: '#808080', borderRadius: 3 } // Changed TOTAL bar color to gray
        ];

        const ctxCascada = document.getElementById('chartCascada');
        if (ctxCascada) {
            chartCascadaInstance = new Chart(ctxCascada, {
                type: 'bar',
                data: {
                    labels: projectNamesCascada,
                    datasets: cascadaDatasets
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    stacked: false, 
                    plugins: {
                        tooltip: {
                            backgroundColor: 'rgba(33, 37, 41, 0.95)',
                            titleFont: { size: 14, family: 'system-ui' },
                            bodyFont: { size: 13, family: 'system-ui' },
                            padding: 15,
                            callbacks: {
                                label: function(context) {
                                    let raw = context.raw;
                                    if (!raw) return '';
                                    
                                    let aportacion = raw[1] - raw[0]; 
                                    
                                    if (context.dataset.label === 'Total') {
                                        return ' 🚀 AVANCE GLOBAL: ' + raw[1].toFixed(1) + '%';
                                    }
                                    
                                    // Multiplicamos por 4 para decirle al usuario al cuánto % va ESA etapa específicamente
                                    let avanceRealEtapa = aportacion * 4; 
                                    return ` ${context.dataset.label}: ${avanceRealEtapa.toFixed(1)}% completado (Aporta +${aportacion.toFixed(1)}% al global)`;
                                }
                            }
                        },
                        legend: {
                            position: 'top',
                            labels: { usePointStyle: true, padding: 20, font: { weight: 'bold', size: 12, family: 'system-ui' } }
                        }
                    },
                    scales: {
                        x: {
                            max: 100, // Topado matemáticamente al 100%
                            title: { display: true, text: 'Progreso Acumulado (%)', font: { weight: 'bold', size: 12 }, color: '#adb5bd' },
                            grid: { color: '#e9ecef', borderDash: [5, 5] },
                            ticks: { callback: function(value) { return value + '%'; } }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { font: { weight: 'bold', size: 13 }, color: '#495057' }
                        }
                    }
                }
            });
        }

   
        const ctx3 = document.getElementById('chartVolumen');
        if (datosEstadoGlobal) {
            chartVolumenInstance = new Chart(ctx3, {
                type: 'doughnut',
                data: {
                    labels: ['ON TIME', 'LATE', 'NEEDS ACTION', 'DECISION'],
                    datasets: [{
                        label: 'Porcentaje de Entregables',
                        data: [
                            datosEstadoGlobal.onTimePercentage,
                            datosEstadoGlobal.latePercentage,
                            datosEstadoGlobal.needsActionPercentage,
                            datosEstadoGlobal.decisionPercentage
                        ],
                        backgroundColor: ['#77DD77', '#FF6961', '#FFB347', '#74B9FF'],
                        borderColor: '#ffffff',
                        borderWidth: 2,
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Porcentaje de Entregables por Estado Global' }
                    }
                }
            });
        }

        // Event listener for sidebar toggle
        window.addEventListener('sidebarToggled', function(e) {
            console.log('Sidebar Toggled:', e.detail.isCollapsed);
            // Give the layout some time to adjust after class changes
            setTimeout(() => {
                if (chartProgresoInstance) chartProgresoInstance.update();
                if (chartCascadaInstance) chartCascadaInstance.update();
                if (chartVolumenInstance) chartVolumenInstance.update();
            }, 700); // Increased timeout to 700ms and using update()
        });
        /*]]>*/
    </script>
</body>
</html>
