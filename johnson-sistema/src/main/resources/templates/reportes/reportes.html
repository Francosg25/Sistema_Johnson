<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <div th:replace="~{fragments/reportes/styles :: styles}"></div>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper"><div th:replace="~{fragments/sidebar :: sidebar(currentUri='reportes')}"></div></div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>

            <div class="bg-blob blob-1"></div>
            <div class="bg-blob blob-2"></div>

            <main class="container-fluid p-4">
                
                <div th:replace="~{fragments/reportes/global_excel :: global_excel}"></div>
                <div th:replace="~{fragments/reportes/executive_roadmap :: executive_roadmap}"></div>

                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card glass-card">
                            <div class="card-header premium-header">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-water premium-icon"></i>
                                    Progress by Stage and Project                                
                                </h6>
                            </div>
                            <div class="card-body waterfall-container" style="max-height: 600px;">
                                <div id="cascadaInnerContainer" style="position: relative; width: 100%;">
                                    <canvas id="chartCascada"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card glass-card">
                            <div class="card-header premium-header">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-bar-chart-fill premium-icon" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6;"></i>
                                    Global Progress Comparation (%)
                                </h6>
                            </div>
                            <div class="card-body chart-container" style="height: 400px;">
                                <canvas id="chartProgreso"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-6">
                        <div class="card glass-card">
                            <div class="card-header premium-header d-flex justify-content-between align-items-center">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-pie-chart-fill premium-icon" style="background: rgba(16, 185, 129, 0.1); color: #10b981;"></i>
                                    Health Task
                                </h6>
                                <select id="selectHealthProyecto" class="form-select form-select-sm border-0 bg-light fw-bold text-secondary shadow-none" style="width: auto; max-width: 600px; cursor: pointer;">
                                    <option value="GLOBAL">Global</option>
                                </select>
                            </div>
                            <div class="card-body chart-container d-flex align-items-center justify-content-center" style="height: 350px;">
                                <canvas id="chartVolumen" style="max-height: 280px;"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card glass-card">
                            <div class="card-header premium-header d-flex justify-content-between align-items-center">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-speedometer2 premium-icon" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;"></i>
                                    Risk Meter
                                </h6>
                                <select id="selectRiesgoProyecto" class="form-select form-select-sm border-0 bg-light fw-bold text-secondary shadow-none" style="width: auto; max-width: 600px; cursor: pointer;">
                                    <option value="GLOBAL">Global</option>
                                </select>
                            </div>
                            <div class="card-body chart-container d-flex align-items-center justify-content-center flex-column pb-4" style="height: 350px;">
                                <canvas id="chartRiesgo" style="max-height: 250px;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Modal para Detalle de Hito -->
                <div class="modal fade" id="modalHitoDetalle" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-sm">
                        <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
                            <div class="modal-body text-center p-4">
                                <div id="hitoIconContainer" class="fs-1 mb-3"></div>
                                <h6 id="hitoNombre" class="fw-bold text-dark mb-1"></h6>
                                <p id="hitoFechaExacta" class="text-primary fw-bold mb-0"></p>
                                <hr class="my-3 opacity-25">
                                <button type="button" class="btn btn-light btn-sm w-100 fw-bold border" data-bs-dismiss="modal">Close</button>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/reportes/scripts :: scripts}"></div>
</body>
</html>
