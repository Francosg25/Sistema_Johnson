<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="text-center p-5 bg-white shadow rounded-4 animate__animated animate__fadeIn" style="max-width: 500px;">
            <div class="display-1 fw-bold text-primary mb-3">404</div>
            <h2 class="fw-bold text-dark mb-3">Page Not Found</h2>
            <p class="text-muted mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <a th:href="@{/}" class="btn btn-primary px-4 py-2 rounded-pill fw-bold">
                <i class="bi bi-house-door me-2"></i>Back to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
