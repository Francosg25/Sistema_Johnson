<div th:fragment="sidebar(currentUri)" class="d-flex flex-column sidebar-je" style="min-height:100vh;">

    <div class="brand-logo">
        <span class="fs-5">JOHNSON</span>
        <span class="fs-5 light">ELECTRIC</span>
    </div>

    <ul class="nav nav-pills flex-column mb-auto mt-3">
        <li class="nav-item">
            <a th:href="@{/}" class="nav-link" th:classappend="${currentUri == '/'} ? 'active' : ''">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/timeline}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/timeline')} ? 'active' : ''">
                <i class="bi bi-calendar3-range"></i> Project Timeline
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/reportes}" class="nav-link" th:classappend="${currentUri.startsWith('/reportes')} ? 'active' : ''">
                <i class="bi bi-graph-up"></i> Reportes
            </a>
        </li>
        
    </ul>

    <div class="sidebar-footer mt-auto">
        <div class="d-flex align-items-center">
            <div class="avatar-initial rounded-circle me-3">
                <strong th:text="${#strings.substring(#authentication?.name, 0, 1)}">U</strong>
            </div>
            <div>
                <strong class="d-block" th:text="${#authentication?.name ?: 'Invitado'}">Usuario</strong>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-link p-0 m-0 border-0 align-baseline small text-decoration-none" style="color: rgb(245, 120, 32);">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </div>
</div>
