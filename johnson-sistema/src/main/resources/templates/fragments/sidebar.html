<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="sidebar(currentUri)" class="sidebar-je d-flex flex-column" style="min-height: 100vh;">
    
    <div class="brand-logo d-flex flex-column align-items-center py-4">
        <span class="fw-black text-dark" style="font-weight: 900; font-size: 1.5rem; letter-spacing: -1px; line-height: 1;">JOHNSON</span>
        <span class="small fw-bold" style="letter-spacing: 4px; color: #F5821F; font-size: 0.65rem;">ELECTRIC</span>
    </div>

    <ul class="nav flex-column mb-auto w-100 mt-2 px-2">
        <li class="nav-item">
            <a th:href="@{/}" class="nav-link" th:classappend="${currentUri == '/' || currentUri == '/index' || currentUri == '/proyectos'} ? 'active' : ''">
                <i class="bi bi-grid-fill"></i> <span>Dashboard</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/timeline}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/timeline')} ? 'active' : ''">
                <i class="bi bi-calendar3-range-fill"></i> <span>Timeline</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/reportes}" class="nav-link" th:classappend="${currentUri == 'reportes' or (currentUri != null and currentUri.startsWith('/reportes'))} ? 'active' : ''">
                <i class="bi bi-bar-chart-fill"></i> <span>Reports</span>
            </a>
        </li>
        <li class="nav-item mt-3 mb-1">
            <span class="px-4 text-uppercase text-muted fw-bold" style="font-size: 0.65rem; letter-spacing: 1px;">Data Management</span>
        </li>
        <li class="nav-item">
            <a th:href="@{/evidencias}" class="nav-link" th:classappend="${currentUri == '/evidencias'} ? 'active' : ''">
                <i class="bi bi-folder-fill"></i> <span>Evidence Vault</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/proyectos/vault}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/proyectos/vault')} ? 'active' : ''">
                <i class="bi bi-archive-fill"></i> <span>Historical Vault</span>
            </a>
        </li>
        <li class="nav-item mt-3 mb-1">
            <span class="px-4 text-uppercase text-muted fw-bold" style="font-size: 0.65rem; letter-spacing: 1px;">System</span>
        </li>
        <li class="nav-item">
            <a th:href="@{/bitacora}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/bitacora')} ? 'active' : ''">
                <i class="bi bi-clock-history"></i> <span>Audit Trail</span>
            </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/usuarios}" class="nav-link" th:classappend="${currentUri != null and currentUri.startsWith('/admin/usuarios')} ? 'active' : ''">
                <i class="bi bi-people-fill"></i> <span>Users Control</span>
            </a>
        </li>
    </ul>

</div>
</body>
</html>
