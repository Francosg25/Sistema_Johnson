<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; min-height: 100vh; overflow-x: hidden;}
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .table thead th { font-size: 0.85rem; font-weight: 800; color: #475569; background-color: #f8fafc !important; padding: 1.1rem; text-transform: uppercase; }
        .table td { padding: 1.2rem 1.1rem; font-size: 0.95rem; vertical-align: middle; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper">
            <div th:replace="~{fragments/sidebar :: sidebar(currentUri=${currentUri})}"></div>
        </div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>
            
            <main class="container-fluid p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold text-slate-900 m-0">Historical Vault</h2>
                        <p class="text-muted mb-0">Archived and completed APQP projects</p>
                    </div>
                </div>

                <div class="card glass-card border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center" style="border-radius: 16px 16px 0 0; padding: 1.25rem 1.5rem;">
                        <h5 class="m-0 fw-bold"></i> ARCHIVE RECORD</h5>
                        <span class="badge bg-secondary text-white rounded-pill px-3 py-2 shadow-sm">READ ONLY</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4">Project</th>
                                        <th class="text-center">Customer</th>
                                        <th class="text-center">SOP Date</th>
                                        <th class="text-center pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(proyectos)}">
                                        <td colspan="4" class="text-center text-muted py-5">
                                            <i class="bi bi-archive display-4 d-block mb-3 opacity-25"></i>
                                            <h5 class="fw-bold">The vault is currently empty</h5>
                                            <p class="small">No projects have been finalized yet.</p>
                                        </td>
                                    </tr>
                                    <tr th:each="p : ${proyectos}">
                                        <td class="ps-4">
                                            <div class="fw-bold text-dark" style="font-size: 1.1rem;" th:text="${p.nombre}"></div>
                                            <div class="text-muted small fw-bold" th:text="${p.numeroParte}"></div>
                                        </td>
                                        <td class="text-center"><span class="badge bg-secondary px-3 py-2 shadow-sm" th:text="${p.cliente}"></span></td>
                                        <td class="text-center text-muted fw-bold" th:text="${p.sop}"></td>
                                        <td class="text-center pe-4">
                                            <a th:href="@{/proyectos/checklist/{id}(id=${p.id})}" class="btn btn-sm btn-dark rounded-pill px-4 fw-bold shadow-sm">
                                                <i class="bi bi-eye-fill me-1"></i> VIEW RECORD
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
