<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="table_program(fase)">
    <div class="card glass-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-bordered mb-0 align-middle" style="font-size: 0.85rem;">
                    <thead class="bg-light small text-uppercase text-muted fw-bold">
                        <tr>
                            <th rowspan="2" style="width: 5%;" class="text-center align-middle">Champion</th>
                            <th rowspan="2" style="width: 20%;" class="align-middle">Deliverables</th>
                            <th colspan="2" style="width: 15%;" class="text-center">Dates</th>
                            <th rowspan="2" style="width: 25%;" class="text-center align-middle">Status</th>
                            <th rowspan="2" style="width: 10%;" class="text-center align-middle">Score</th>
                            <th rowspan="2" style="width: 15%;" class="align-middle">Remarks</th>
                            <th rowspan="2" class="text-center align-middle" style="width: 50px;" title="Evidence">
                                <i class="bi bi-paperclip fs-5 text-secondary"></i>
                            </th>
                        </tr>
                        <tr class="text-center">
                            <th style="width: 7.5%;">Plan</th>
                            <th style="width: 7.5%;">Control</th>
                        </tr>
                    </thead>                                        
                    <tbody>
                        <th:block th:each="item, iterStat : ${fase.items}">
                            <tr th:if="${iterStat.index == 0 or !fase.items[iterStat.index - 1].etapaVisual.equals(item.etapaVisual)}" class="table-group-header">
                                <td colspan="8" class="fw-bold text-uppercase py-2 px-3 text-dark">
                                    <i class="bi bi-collection me-2 text-primary"></i><span th:text="${item.etapaVisual}"></span>
                                </td>
                            </tr>
                            
                            <tr>
                                <td class="text-center fw-bold" rowspan="2" style="vertical-align: middle;">
                                    <span class="badge w-100 shadow-sm" 
                                          th:with="normChamp=${@checklistLogicServicio.normalizarChampion(item.champion)}"
                                          th:classappend="'champ-' + ${#strings.toLowerCase(normChamp).replace('/', '-')}" 
                                          th:text="${normChamp}"
                                          th:title="${@checklistLogicServicio.obtenerNombreCompletoChampion(normChamp)}"></span>
                                </td>

                                <td rowspan="2" style="vertical-align: middle; background-color: rgba(255, 250, 205, 0.4) !important;">
                                    <span class="d-block fw-bold text-dark" th:text="${item.nombre}"></span>
                                </td>

                                <td class="fw-bold small ps-2 text-muted">Plan</td>
                                <td class="text-center">
                                    <input type="date" class="form-control form-control-sm border-0 bg-transparent text-center p-0 fw-bold text-secondary" th:name="'fechaPlan-' + ${item.id}" th:value="${item.fechaPlan}">
                                </td>
                                <td class="text-center" rowspan="2" style="vertical-align: middle;">
                                    <select class="form-select form-select-sm border-0 fw-bold text-center" th:name="'controlEntregable-' + ${item.id}"
                                            th:classappend="${
                                                item.controlEntregable == 'Closed on time' ? 'status-on-time' :
                                                (item.controlEntregable == 'Closed late' ? 'status-late' :
                                                (item.controlEntregable == 'DECISION' ? 'status-decision' :
                                                (item.controlEntregable == 'NEEDS ACTION' ? 'status-needs-action' : 'status-default')))}">
                                        <option value="" th:selected="${item.controlEntregable == '' || item.controlEntregable == null}"></option> 
                                        <option th:selected="${item.controlEntregable == 'Closed on time'}" value="Closed on time">ON TIME</option>
                                        <option th:selected="${item.controlEntregable == 'Closed late'}" value="Closed late">LATE</option>
                                        <option th:selected="${item.controlEntregable == 'DECISION'}" value="DECISION">DECISION</option>
                                        <option th:selected="${item.controlEntregable == 'NEEDS ACTION'}" value="NEEDS ACTION">NEEDS ACTION</option>
                                    </select>
                                </td>
                                <td class="text-center" rowspan="2" style="vertical-align: middle;">
                                    <select class="form-select form-select-sm border-0 fw-bold text-center" th:name="'score-' + ${item.id}"
                                            th:classappend="${item.score == 'OK' ? 'status-on-time' : (item.score == 'N/A' ? 'status-default' : 'status-default')}">
                                        <option value="" th:selected="${item.score == '' || item.score == null}"></option> 
                                        <option th:selected="${item.score == 'OK'}" value="OK">OK</option>
                                        <option th:selected="${item.score == 'N/A'}" value="N/A">N/A</option>
                                    </select>
                                </td>
                                
                                <td rowspan="2" style="max-width: 125px; vertical-align: middle;">
                                    <div class="d-flex justify-content-between align-items-center bg-white bg-opacity-50 rounded p-1 border shadow-sm"
                                         style="cursor: pointer; transition: 0.2s;" onmouseover="this.style.borderColor='#80bdff'" onmouseout="this.style.borderColor='#dee2e6'" th:onclick="abrirEditorComentarios([[${item.id}]], [[${item.codigo}]])">
                                        <div class="text-truncate small ms-2 w-100" th:id="'preview-comentario-' + ${item.id}"
                                             th:classappend="${item.comentario == null or item.comentario.isEmpty() ? 'text-muted fst-italic' : 'text-dark fw-bold'}"
                                             th:text="${item.comentario == null or item.comentario.isEmpty() ? '' : item.comentario}">
                                        </div>
                                        <button type="button" 
                                                th:id="'btn-comentario-' + ${item.id}"
                                                th:class="${item.comentario != null and !item.comentario.empty} ? 
                                                          'btn btn-sm btn-primary border-0 rounded-circle ms-1 shadow-sm flex-shrink-0' : 
                                                          'btn btn-sm btn-light text-secondary border-0 rounded-circle ms-1 shadow-sm flex-shrink-0'"
                                                th:attr="onclick=|abrirEditorComentarios('${item.id}', '${item.codigo}')|">
                                            <i th:id="'btn-icon-comentario-' + ${item.id}" 
                                               th:class="${item.comentario != null and !item.comentario.empty} ? 'bi bi-chat-text-fill' : 'bi bi-pencil'"></i>
                                        </button>
                                    </div>
                                    <textarea class="d-none" th:name="'comentario-' + ${item.id}" th:id="'real-comentario-' + ${item.id}" th:text="${item.comentario}"></textarea>
                                </td>
                                
                                <td class="text-center" rowspan="2" style="vertical-align: middle;">
                                    <button type="button" class="btn btn-sm border shadow-sm rounded-circle" 
                                            th:id="'btn-evidencia-' + ${item.id}"
                                            th:classappend="${item.adjuntos != null and !item.adjuntos.isEmpty()} ? 'btn-primary' : 'btn-light'"
                                            data-bs-toggle="modal" 
                                            th:data-bs-target="'#modalEvidencia_' + ${item.id}"
                                            title="Upload/View Evidence">
                                        <i th:id="'btn-icon-evidencia-' + ${item.id}" class="bi bi-cloud-arrow-up-fill" th:classappend="${item.adjuntos != null and !item.adjuntos.isEmpty()} ? 'text-white' : 'text-primary'"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td class="fw-bold small ps-2 text-muted">Real</td>
                                <td class="text-center">
                                    <input type="date" class="form-control form-control-sm border-0 bg-transparent text-center p-0 fw-bold text-success" th:name="'fechaReal-' + ${item.id}" th:value="${item.fechaReal}">
                                </td>
                            </tr>
                        </th:block>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
