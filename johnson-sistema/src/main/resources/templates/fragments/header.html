<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-light" style="position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); width: 100%; border-bottom: 1px solid rgba(226, 232, 240, 0.8);">
    <div class="container-fluid px-3">

        <button class="btn btn-link text-dark me-3 rounded-circle p-2 hover-bg-light" id="sidebarToggle" style="transition: all 0.2s;">
            <i class="bi bi-list fs-4"></i>
        </button>

        <h5 class="navbar-brand mb-0 fw-black text-dark" style="letter-spacing: -0.5px; font-weight: 800;">
            APQP <span style="color: #F5821F;">Dashboard</span>
        </h5>

        <div class="ms-auto d-flex align-items-center gap-1">
            
            <div class="dropdown me-2" id="notifDropdownContainer">
                <button class="btn btn-light border-0 shadow-none position-relative rounded-circle p-2 hover-bg-light" type="button" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false" onclick="registrarNotificacionesVistas();">
                    <i class="bi bi-bell fs-5 text-dark"></i>
                    <span id="notifBadge" class="position-absolute badge rounded-pill bg-danger d-none shadow-sm" style="z-index: 10; font-size: 0.65rem; padding: 0.35em 0.5em; top: 2px; right: 2px; transform: translate(30%, 30%); border: 2px solid #fff;">
                        0
                    </span>
                </button>
                <div class="dropdown-menu dropdown-menu-end border-0 p-0" aria-labelledby="notifDropdown" style="width: 360px; border-radius: 16px; overflow: hidden; z-index: 1060; margin-top: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
                    <div class="bg-white p-3 border-bottom d-flex justify-content-between align-items-center">
                        <h6 class="m-0 fw-black text-dark">Notifications</h6>
                        <button class="btn btn-link btn-sm p-0 text-decoration-none small fw-bold" style="color: #F5821F;" onclick="event.stopPropagation(); marcarTodasComoLeidas()">Mark all as read</button>
                    </div>
                    <div id="notifList" class="overflow-auto bg-white" style="max-height: 400px;">
                        <div class="p-4 text-center text-muted small fw-medium">
                            <i class="bi bi-bell-slash d-block fs-3 mb-2 opacity-25"></i>
                            You have no new notifications
                        </div>
                    </div>
                    <div class="bg-light p-2 text-center border-top">
                        <span class="text-muted fw-bold" style="font-size: 0.65rem; letter-spacing: 0.5px;">JOHNSON ELECTRIC APQP</span>
                    </div>
                </div>
            </div>

            <div class="dropdown" id="userProfileContainer">
                <button class="btn btn-light border-0 shadow-none d-flex align-items-center p-1 rounded-pill pe-3 hover-profile" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="transition: all 0.2s ease; background: transparent;">
                    <div class="text-white rounded-circle d-flex align-items-center justify-content-center fw-bold me-2 shadow-sm" style="width: 36px; height: 36px; font-size: 0.95rem; background: #1e293b;">
                        <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                    </div>
                    <div class="text-start d-none d-sm-block">
                        <div class="fw-black text-dark lh-1" style="font-size: 0.85rem;" th:text="${#authentication.name}">Username</div>
                        <div class="text-muted fw-medium" style="font-size: 0.7rem;" th:text="${#authentication.principal.nombreCompletoDepartamento}">Department</div>
                    </div>
                    <i class="bi bi-chevron-down ms-2 text-muted" style="font-size: 0.7rem;"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end border-0 p-2 mt-2" aria-labelledby="profileDropdown" style="width: 220px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
                    <li>
                        <div class="px-3 py-2 border-bottom mb-2 bg-light rounded-3">
                            <span class="d-block fw-black text-dark" style="font-size: 0.85rem;" th:text="${#authentication.name}">Username</span>
                            <span class="d-block text-muted fw-medium" style="font-size: 0.7rem;" th:text="${#authentication.principal.nombreCompletoDepartamento}">Department</span>
                        </div>
                    </li>
                    <li>
                        <form th:action="@{/logout}" method="post" id="logoutForm">
                            <button type="submit" class="dropdown-item rounded-3 d-flex align-items-center py-2 text-danger transition-hover">
                                <div class="bg-soft-danger p-1 rounded-2 me-2" style="background: #fef2f2;">
                                    <i class="bi bi-box-arrow-right"></i>
                                </div>
                                <span class="fw-bold" style="font-size: 0.85rem;">Secure Logout</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script>
        let stompClient = null;
        let maxIdEnPantalla = 0;

        function conectarWebSocket() {
            const socket = new SockJS('/ws-johnson');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; 

            stompClient.connect({}, function (frame) {
                stompClient.subscribe('/user/queue/notificaciones', function (msg) {
                    fetchNotificaciones(); 
                    animarCampana();
                });
            }, function(error) {
                console.log('STOMP: Connection lost. Retrying in 5s...');
                setTimeout(conectarWebSocket, 5000);
            });
        }

        function animarCampana() {
            const iconoCampana = document.querySelector('#notifDropdown i.bi-bell');
            if (iconoCampana) {
                iconoCampana.classList.add('notif-shake');
                setTimeout(() => iconoCampana.classList.remove('notif-shake'), 500);
            }
        }

        function fetchNotificaciones() {
            fetch('/api/notificaciones/resumen')
                .then(r => r.json())
                .then(data => {
                    renderNotificaciones(data);
                })
                .catch(err => console.error("Error fetching notifications:", err));
        }

        function renderNotificaciones(data) {
            const badge = document.getElementById('notifBadge');
            const list = document.getElementById('notifList');
            const bell = document.querySelector('#notifDropdown i.bi-bell');
            
            let lastSeenId = parseInt(localStorage.getItem('lastSeenNotifId') || '0');
            
            let nuevasContadas = 0;
            if (data.ultimas && data.ultimas.length > 0) {
                maxIdEnPantalla = Math.max(...data.ultimas.map(n => n.id));

                if (maxIdEnPantalla < lastSeenId) {
                    lastSeenId = 0;
                    localStorage.setItem('lastSeenNotifId', '0');
                }

                nuevasContadas = data.ultimas.filter(n => n.id > lastSeenId).length;
            }

            if (nuevasContadas > 0) {
                badge.innerText = nuevasContadas > 9 ? '9+' : nuevasContadas;
                badge.classList.remove('d-none');
                if (bell) bell.classList.add('notif-active');
            } else {
                badge.classList.add('d-none');
                if (bell) bell.classList.remove('notif-active');
            }

            if (!list) return;

            if (!data || !data.ultimas || data.ultimas.length === 0) {
                list.innerHTML = '<div class="p-4 text-center text-muted small fw-medium"><i class="bi bi-bell-slash d-block fs-3 mb-2 opacity-25"></i>You have no new notifications</div>';
                return;
            }

            list.innerHTML = data.ultimas.map(n => {
                const f = formatoFecha(n.fechaCreacion);
                const esNueva = n.id > lastSeenId ? 'bg-white border-start border-4' : 'bg-white opacity-75';
                const borderColor = esNueva ? 'border-color: #F5821F !important;' : '';

                return `
                <div class="p-3 border-bottom position-relative hover-bg-light ${esNueva}" style="cursor: pointer; ${borderColor} transition: all 0.2s;" onclick="marcarLeida(${n.id}, '${n.link}')">
                    <div class="d-flex align-items-start">
                        <div class="rounded-circle p-2 me-3 d-flex align-items-center justify-content-center ${getIconBg(n.tipo)} shadow-sm" style="width: 36px; height: 36px; flex-shrink: 0;">
                            <i class="bi ${getIcon(n.tipo)} text-white" style="font-size: 1rem;"></i>
                        </div>
                        <div class="flex-grow-1" style="min-width: 0;">
                            <div class="small fw-bold text-dark lh-sm mb-1">${n.titulo}</div>
                            <div class="text-muted" style="font-size: 0.75rem; line-height: 1.2;">${n.mensaje}</div>
                            <div class="d-flex justify-content-between align-items-center mt-2 pt-1 border-top border-light">
                                <div class="text-muted fw-bold" style="font-size: 0.65rem;"><i class="bi bi-clock me-1"></i>${f.hora} - ${f.fecha}</div>
                                <div class="text-end">
                                    <span class="badge bg-light text-dark border" style="font-size: 0.6rem;">${n.autorAccion || 'System'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function registrarNotificacionesVistas() {
            if (maxIdEnPantalla > 0) {
                localStorage.setItem('lastSeenNotifId', maxIdEnPantalla.toString());
            }
            document.getElementById('notifBadge').classList.add('d-none');
            const bell = document.querySelector('#notifDropdown i.bi-bell');
            if (bell) bell.classList.remove('notif-active');
        }

        function getIcon(tipo) {
            if (!tipo) return 'bi-info-circle-fill';
            const t = tipo.toUpperCase();
            if (t === 'ALERT' || t === 'ALERTA') return 'bi-exclamation-triangle-fill';
            if (t === 'SUCCESS' || t === 'EXITO') return 'bi-check-circle-fill';
            return 'bi-info-circle-fill';
        }

        function getIconBg(tipo) {
            if (!tipo) return 'bg-primary'; /* Puedes cambiar esto a un gris neutro si prefieres */
            const t = tipo.toUpperCase();
            if (t === 'ALERT' || t === 'ALERTA') return 'bg-danger';
            if (t === 'SUCCESS' || t === 'EXITO') return 'bg-success';
            return 'bg-secondary';
        }

        function formatoFecha(fecha) {
            if (!fecha) return { hora: "", fecha: "" };
            let d;
            if (Array.isArray(fecha)) {
                d = new Date(fecha[0], fecha[1] - 1, fecha[2], fecha[3] || 0, fecha[4] || 0, fecha[5] || 0);
            } else {
                d = new Date(fecha);
            }
            if (isNaN(d.getTime())) return { hora: "", fecha: "" };
            
            const hora = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const fechaStr = d.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: 'numeric' });
            return { hora, fecha: fechaStr };
        }

        function marcarLeida(id, link) {
            fetch('/api/notificaciones/marcar-leida/' + id, { method: 'POST' })
                .then(() => {
                    if (link && link !== 'null' && link !== 'undefined') window.location.href = link;
                    else fetchNotificaciones();
                });
        }

        function marcarTodasComoLeidas() {
            fetch('/api/notificaciones/marcar-todas-leidas', { method: 'POST' })
                .then(() => {
                    fetchNotificaciones();
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            conectarWebSocket();
            fetchNotificaciones();
        });
        
    </script>
    <style>
        .hover-bg-light:hover { background-color: #f8fafc !important; }
        .hover-profile:hover { background-color: #f1f5f9 !important; }
        .transition-hover:hover { transform: translateX(4px); background-color: #f8fafc; }
        #notifList::-webkit-scrollbar { width: 4px; }
        #notifList::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #notifDropdown i { transition: transform 0.15s ease-in-out; }
        
        @keyframes shake {
            0% { transform: rotate(0) scale(1); }
            15% { transform: rotate(15deg) scale(1.1); }
            30% { transform: rotate(-15deg) scale(1.1); }
            45% { transform: rotate(10deg) scale(1.1); }
            60% { transform: rotate(-10deg) scale(1.1); }
            75% { transform: rotate(5deg) scale(1.1); }
            85% { transform: rotate(-5deg) scale(1.1); }
            100% { transform: rotate(0) scale(1); }
        }
        .notif-shake { animation: shake 0.5s ease-in-out; color: #F5821F !important; }
        .notif-active { color: #F5821F !important; }
    </style>
</nav>
</body>
</html>
