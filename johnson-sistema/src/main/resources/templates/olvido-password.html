<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <style>
        body {
            background: linear-gradient(135deg, #f5821f 0%, #e0600d 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h3 class="fw-black text-dark">Recuperar Acceso</h3>
            <p class="text-muted small">Ingresa tu correo para recibir un enlace de recuperación.</p>
        </div>

        <div th:if="${mensaje}" class="alert alert-success small mb-4" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger small mb-4" th:text="${error}"></div>

        <form th:action="@{/olvido-password}" method="post">
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-primary"></i></span>
                    <input type="email" name="correo" class="form-control bg-light border-start-0" placeholder="tu@correo.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm mb-3">Enviar Enlace</button>
            
            <div class="text-center">
                <a th:href="@{/login}" class="text-decoration-none small fw-bold text-primary">Volver al inicio de sesión</a>
            </div>
        </form>
    </div>
</body>
</html>
