<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .bg-blob {
            position: fixed;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(245, 130, 31, 0.15) 0%, rgba(245, 130, 31, 0.05) 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }
        .blob-1 { top: -100px; right: -100px; }
        .blob-2 { bottom: -100px; left: -100px; background: linear-gradient(135deg, rgba(13, 110, 253, 0.12) 0%, rgba(13, 110, 253, 0.05) 100%); }

        /* --- GLASS CARDS --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.6) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            border-radius: 20px !important;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07) !important;
            overflow: hidden;
        }
        
        .premium-header {
            background: rgba(255, 255, 255, 0.3) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;
            padding: 1.25rem 1.5rem;
        }

        .premium-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #2b3035;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
        }
        .premium-icon {
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(245, 130, 31, 0.1);
            color: #F5821F;
            margin-right: 12px;
            font-size: 1.1rem;
        }

        .audit-timeline {
            position: relative;
            padding: 20px 0;
        }
        .audit-item {
            position: relative;
            padding-left: 50px;
            margin-bottom: 30px;
            border-left: 2px solid rgba(0,0,0,0.05);
            margin-left: 25px;
        }
        .audit-icon {
            position: absolute;
            left: -18px;
            top: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1;
        }
        .audit-time {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }
        .audit-user {
            font-weight: 800;
            color: #1e293b;
            font-size: 0.9rem;
        }
        .audit-action {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-left: 10px;
        }
        .action-update { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .action-create { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .action-delete { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .action-default { background: rgba(148, 163, 184, 0.1); color: #64748b; }

        .audit-detail {
            margin-top: 10px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            color: #475569;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper"><div th:replace="~{fragments/sidebar :: sidebar(currentUri='/bitacora')}"></div></div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>

            <main class="container-fluid p-4">
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div>
                                <h4 class="fw-bold text-dark m-0" style="letter-spacing: -0.5px;">
                                    <i class="bi bi-clock-history text-primary me-2"></i>Audit Trail
                                </h4>
                                <p class="text-muted small fw-medium mb-0 mt-1">Historial de cambios y actividades del sistema</p>
                            </div>
                        </div>

                        <div class="card glass-card">
                            <div class="card-header premium-header">
                                <h6 class="m-0 premium-title">
                                    <i class="bi bi-list-ul premium-icon"></i>
                                    Últimos 50 Movimientos
                                </h6>
                            </div>
                            <div class="card-body p-4">
                                <div th:if="${movimientos.empty}" class="text-center py-5">
                                    <i class="bi bi-info-circle fs-1 text-muted opacity-50 mb-3 d-block"></i>
                                    <p class="text-muted">No hay registros de actividad aún.</p>
                                </div>
                                
                                <div class="audit-timeline" th:if="${!movimientos.empty}">
                                    <div th:each="m : ${movimientos}" class="audit-item">
                                        <div class="audit-icon">
                                            <i th:class="${m.accion.contains('ACTUALIZO') ? 'bi bi-pencil-fill text-primary' : 
                                                        (m.accion.contains('CREO') ? 'bi bi-plus-circle-fill text-success' : 
                                                        (m.accion.contains('ELIMINO') ? 'bi bi-trash-fill text-danger' : 'bi bi-info-circle-fill text-secondary'))}"></i>
                                        </div>
                                        <span class="audit-time" th:text="${m.getFechaFormateada()}">Fecha</span>
                                        <div>
                                            <span class="audit-user" th:text="${m.usuario}">Usuario</span>
                                            <span class="audit-action" 
                                                  th:classappend="${m.accion.contains('ACTUALIZO') ? 'action-update' : 
                                                                  (m.accion.contains('CREO') ? 'action-create' : 
                                                                  (m.accion.contains('ELIMINO') ? 'action-delete' : 'action-default'))}"
                                                  th:text="${m.accion}">ACCION</span>
                                        </div>
                                        <div class="audit-detail" th:text="${m.detalle}">
                                            Detalle del cambio realizado...
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
