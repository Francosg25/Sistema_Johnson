<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; min-height: 100vh; overflow-x: hidden;}
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .table thead th { font-size: 0.85rem; font-weight: 800; color: #475569; background-color: #f8fafc !important; padding: 1.1rem; text-transform: uppercase; }
        .table td { padding: 1.2rem 1.1rem; font-size: 0.95rem; vertical-align: middle; border-bottom: 1px solid #f1f5f9; }
        
        /* Personalización de los botones de los meses */
        .btn-month {
            background-color: #e0e7ff !important; /* Azul muy claro */
            color: #4338ca !important; /* Texto azul índigo */
            border: 1px solid #c7d2fe !important;
            transition: all 0.2s ease-in-out;
        }
        .btn-month:hover {
            background-color: #c7d2fe !important;
            transform: translateY(-1px);
        }
        .btn-month i {
            color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper">
            <div th:replace="~{fragments/sidebar :: sidebar(currentUri=${currentUri})}"></div>
        </div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>
            
            <main class="container-fluid p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold text-dark m-0"><i class="bi bi-archive-fill me-2 text-primary"></i>Historical Vault</h2>
                        <p class="text-muted mb-0">Browse archived projects by timeline</p>
                    </div>
                    <div class="search-box">
                        <input type="text" id="vaultSearch" class="form-control rounded-pill shadow-sm" placeholder="Search by P/N or Name...">
                    </div>
                </div>

                <div class="accordion border-0 shadow-sm" id="accordionVault">
                    <div th:each="entryAño : ${agrupados}" class="accordion-item border-0 mb-3 glass-card">
                        <h2 class="accordion-header">
                            <button class="accordion-button fw-bold fs-5 text-primary bg-white rounded-4" type="button" 
                                    data-bs-toggle="collapse" th:data-bs-target="'#año-' + ${entryAño.key}">
                                <i class="bi bi-calendar3 me-3"></i> 
                                <span th:text="${entryAño.key}">2026</span>
                                <span class="badge bg-light text-primary ms-3 border" th:text="${entryAño.value.size() + ' Months'}"></span>
                            </button>
                        </h2>
                        <div th:id="'año-' + ${entryAño.key}" class="accordion-collapse collapse show">
                            <div class="accordion-body p-4">
                                
                                <div th:each="entryMes : ${entryAño.value}" class="mb-3">
                                    <div class="d-grid">
                                        <button class="btn btn-month d-flex justify-content-between align-items-center py-2 px-3 mb-2 shadow-sm rounded-3" 
                                                type="button" 
                                                data-bs-toggle="collapse" 
                                                th:data-bs-target="'#mes-' + ${entryAño.key} + '-' + ${entryMes.key}">
                                            <span class="text-uppercase fw-bold small">
                                                <i class="bi bi-folder2-open me-2"></i><span th:text="${entryMes.key}">March</span>
                                            </span>
                                            <i class="bi bi-chevron-down small opacity-50"></i>
                                        </button>
                                    </div>
                                    
                                    <div class="collapse show" th:id="'mes-' + ${entryAño.key} + '-' + ${entryMes.key}">
                                        <div class="row g-3 pb-2">
                                            <div th:each="p : ${entryMes.value}" class="col-xl-3 col-lg-4 col-md-6 project-card">
                                                <div class="card h-100 border-0 shadow-sm hover-lift" style="border-radius: 15px; background: #fff;">
                                                    <div class="card-body p-3">
                                                        <div class="d-flex align-items-start justify-content-between mb-2">
                                                            <div class="folder-icon text-warning">
                                                                <i class="bi bi-folder-fill fs-2"></i>
                                                            </div>
                                                            <span class="badge bg-secondary-subtle text-secondary small" th:text="${p.cliente}">CLIENT</span>
                                                        </div>
                                                        <h6 class="fw-bold text-dark mb-1 text-truncate" th:text="${p.nombre}">Project Name</h6>
                                                        <p class="text-muted small mb-3">P/N: <span th:text="${p.numeroParte}">-</span></p>
                                                        
                                                        <div class="d-grid gap-2">
                                                            <a th:href="@{/proyectos/checklist/{id}(id=${p.id})}" class="btn btn-outline-dark btn-sm rounded-pill fw-bold">
                                                                <i></i> Review
                                                            </a>
                                                            <button th:attr="onclick=|abrirModalEvidencias('${p.id}', '${p.nombre}')|" 
                                                                    class="btn btn-primary btn-sm rounded-pill fw-bold">
                                                                <i></i> Open Evidence
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <div class="modal fade" id="modalEvidenciasProyecto" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                    <div class="modal-header bg-primary text-white py-3" style="border-radius: 20px 20px 0 0;">
                        <h5 class="modal-title fw-bold">
                            <i class="bi bi-archive-fill me-2"></i>Evidence Vault: <span id="modalProyectoNombre"></span>
                        </h5>
                        <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-0">
                        <div id="loadingEvidencias" class="text-center py-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="mt-2 text-muted fw-bold">Retrieving archive...</p>
                        </div>
                        <div id="tablaEvidenciasContainer" style="display: none;">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="bg-light small fw-bold text-muted">
                                        <tr>
                                            <th class="ps-4">File Name</th>
                                            <th>APQP Deliverable</th>
                                            <th class="text-center pe-4">Download</th>
                                        </tr>
                                    </thead>
                                    <tbody id="cuerpoTablaEvidencias"></tbody>
                                </table>
                            </div>
                        </div>
                        <div id="noEvidenciasMsg" class="text-center py-5" style="display: none;">
                            <i class="bi bi-folder-x display-4 text-muted opacity-25"></i>
                            <p class="mt-2 text-muted fw-bold">No evidence files found for this project.</p>
                        </div>
                    </div>
                    <div class="modal-footer border-0 bg-light py-3" style="border-radius: 0 0 20px 20px;">
                        <button type="button" class="btn btn-secondary btn-sm fw-bold px-4 rounded-pill" data-bs-dismiss="modal">Close Vault</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalVisor" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-centered" style="height: 90vh;">
                <div class="modal-content h-100 border-0 shadow-lg" style="border-radius: 20px; overflow: hidden;">
                    <div class="modal-header bg-dark text-white py-3">
                        <h6 class="modal-title fw-bold">
                            <i class="bi bi-file-earmark-text me-2"></i>Document Viewer: <span id="visorFileName" class="text-info"></span>
                        </h6>
                        <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-0 bg-light d-flex align-items-center justify-content-center" id="visorContainer"></div>
                    <div class="modal-footer bg-white py-2 border-top">
                        <button type="button" class="btn btn-secondary btn-sm fw-bold px-4 rounded-pill" data-bs-dismiss="modal">Close</button>
                        <a id="btnDescargarVisor" href="#" class="btn btn-primary btn-sm fw-bold px-4 rounded-pill">
                            <i class="bi bi-download me-1"></i>Download
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function abrirVisor(id, nombre) {
            document.getElementById('visorFileName').textContent = nombre;
            const container = document.getElementById('visorContainer');
            const btnDescargar = document.getElementById('btnDescargarVisor');
            btnDescargar.href = '/evidencias/descargar/' + id;
            container.innerHTML = '<div class="spinner-border text-primary"></div>';
            const urlVer = '/evidencias/visualizar/' + id;
            const ext = nombre.split('.').pop().toLowerCase();
            const visorModal = new bootstrap.Modal(document.getElementById('modalVisor'));
            visorModal.show();
            setTimeout(() => {
                if (['pdf', 'jpg', 'jpeg', 'png', 'gif', 'txt'].includes(ext)) {
                    container.innerHTML = `<iframe src="${urlVer}" style="width:100%; height:100%; border:none;"></iframe>`;
                } else {
                    container.innerHTML = `<div class="text-center p-5"><i class="bi bi-file-earmark-zip display-1 text-muted opacity-25"></i><h5 class="mt-3 fw-bold">Preview not available</h5><p class="text-muted">Direct browser viewing is not supported for <b>.${ext}</b> files.</p><a href="${btnDescargar.href}" class="btn btn-primary rounded-pill px-4"><i class="bi bi-download me-2"></i>Download to view</a></div>`;
                }
            }, 300);
        }

        function abrirModalEvidencias(proyectoId, proyectoNombre) {
            const modal = new bootstrap.Modal(document.getElementById('modalEvidenciasProyecto'));
            document.getElementById('modalProyectoNombre').textContent = proyectoNombre;
            document.getElementById('loadingEvidencias').style.display = 'block';
            document.getElementById('tablaEvidenciasContainer').style.display = 'none';
            document.getElementById('noEvidenciasMsg').style.display = 'none';
            document.getElementById('cuerpoTablaEvidencias').innerHTML = '';
            modal.show();
            fetch('/evidencias/proyecto/' + proyectoId)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loadingEvidencias').style.display = 'none';
                    if (data && data.length > 0) {
                        const tbody = document.getElementById('cuerpoTablaEvidencias');
                        data.forEach(ev => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `<td class="ps-4"><div class="d-flex align-items-center"><i class="bi bi-file-earmark-lock-fill text-primary fs-5 me-2"></i><span class="fw-bold text-dark small">${ev.nombre}</span></div></td><td class="text-muted small fw-bold">${ev.entregable}</td><td class="text-center pe-4"><div class="btn-group shadow-none"><button type="button" class="btn btn-sm btn-outline-primary rounded-circle me-1" onclick="abrirVisor('${ev.id}', '${ev.nombre}')"><i class="bi bi-eye-fill"></i></button><a href="/evidencias/descargar/${ev.id}" class="btn btn-sm btn-outline-primary rounded-circle"><i class="bi bi-cloud-arrow-down-fill"></i></a></div></td>`;
                            tbody.appendChild(tr);
                        });
                        document.getElementById('tablaEvidenciasContainer').style.display = 'block';
                    } else {
                        document.getElementById('noEvidenciasMsg').style.display = 'block';
                    }
                })
                .catch(err => { console.error('Error fetching evidences:', err); alert("Error connection to the vault archive."); });
        }

        // Lógica del Buscador del Vault
document.getElementById('vaultSearch').addEventListener('input', function() {
    const term = this.value.toLowerCase().trim();
    const years = document.querySelectorAll('.accordion-item');

    years.forEach(year => {
        let yearHasVisibleProjects = false;
        const months = year.querySelectorAll('.mb-3'); // Contenedores de meses

        months.forEach(month => {
            let monthHasVisibleProjects = false;
            const projects = month.querySelectorAll('.project-card');

            projects.forEach(project => {
                const name = project.querySelector('h6').textContent.toLowerCase();
                const pn = project.querySelector('p').textContent.toLowerCase();
                const client = project.querySelector('.badge').textContent.toLowerCase();

                if (name.includes(term) || pn.includes(term) || client.includes(term)) {
                    project.style.display = "block";
                    monthHasVisibleProjects = true;
                    yearHasVisibleProjects = true;
                } else {
                    project.style.display = "none";
                }
            });

            month.style.display = monthHasVisibleProjects ? "block" : "none";
        });

        year.style.display = yearHasVisibleProjects ? "block" : "none";
    });
});
    </script>
    </body>
</html>
