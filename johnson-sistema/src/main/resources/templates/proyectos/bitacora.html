<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Audit Trail - Sistema Johnson</title>
    <th:block layout:fragment="custom-css">
        <style>
            .audit-timeline { position: relative; padding: 20px 0; }
            .audit-item { position: relative; padding-left: 50px; margin-bottom: 30px; border-left: 2px solid #e2e8f0; margin-left: 25px; }
            .audit-icon { position: absolute; left: -18px; top: 0; width: 34px; height: 34px; border-radius: 12px; background: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 1; border: 1px solid #f1f5f9; }
            .audit-time { font-size: 0.75rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; display: block; }
            .audit-user { font-weight: 800; color: var(--premium-blue); font-size: 0.95rem; }
            .audit-action { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-left: 10px; letter-spacing: 0.02em; }
            .action-update { background: #eff6ff; color: #3b82f6; }
            .action-create { background: #ecfdf5; color: #10b981; }
            .action-delete { background: #fef2f2; color: #ef4444; }
            .action-default { background: #f8fafc; color: #64748b; }
            .audit-detail { margin-top: 12px; padding: 15px; background: #f8fafc; border-radius: 16px; border: 1px dashed #e2e8f0; font-size: 0.85rem; color: #475569; line-height: 1.5; font-weight: 500; }
        </style>
    </th:block>
</head>
<body>

    <main layout:fragment="content">
        <div class="d-flex justify-content-between align-items-end mb-5">
            <div>
                <nav aria-label="breadcrumb" class="mb-2">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item small text-muted text-uppercase fw-bold letter-spacing-lg">Overview</li>
                        <li class="breadcrumb-item small text-muted text-uppercase fw-bold active">Audit Trail</li>
                    </ol>
                </nav>
                <h3 class="fw-black text-premium-blue m-0 display-6" style="font-weight: 900; letter-spacing: -0.04em;">Audit Trail</h3>
                <p class="text-muted small fw-medium mt-2 mb-0">System changes and activities history</p>
            </div>
        </div>

        <div class="row mb-5">
            <div class="col-12">
                <div class="card glass-card border-0">
                    <div class="card-header glass-header d-flex align-items-center">
                        <div class="rounded-3 p-2 me-3" style="background: #f0f7ff;">
                            <i class="bi bi-list-ul text-primary fs-5"></i>
                        </div>
                        <h6 class="m-0 text-uppercase fw-bold">Last 50 Movements</h6>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <div th:if="${movimientos.empty}" class="text-center py-5">
                            <i class="bi bi-info-circle fs-1 text-muted opacity-50 mb-3 d-block"></i>
                            <p class="text-muted fw-bold">No activity records yet.</p>
                        </div>
                        
                        <div class="audit-timeline" th:if="${!movimientos.empty}">
                            <div th:each="m : ${movimientos}" class="audit-item">
                                <div class="audit-icon">
                                    <i th:class="${m.accion.contains('UPDATE') ? 'bi bi-pencil-fill text-primary' : 
                                                (m.accion.contains('CREATE') ? 'bi bi-plus-circle-fill text-success' : 
                                                (m.accion.contains('DELETE') ? 'bi bi-trash-fill text-danger' : 'bi bi-info-circle-fill text-secondary'))}"></i>
                                </div>
                                <span class="audit-time" th:text="${m.getFechaFormateada()}">Fecha</span>
                                <div class="d-flex align-items-center mb-2">
                                    <span class="audit-user" th:text="${m.usuario}">Usuario</span>
                                    <span class="audit-action" 
                                            th:classappend="${m.accion.contains('UPDATE') ? 'action-update' : 
                                                            (m.accion.contains('CREATE') ? 'action-create' : 
                                                            (m.accion.contains('DELETE') ? 'action-delete' : 'action-default'))}"
                                            th:text="${m.accion}">ACCION</span>
                                </div>
                                <div class="audit-detail" th:text="${m.detalle}">
                                    Detail of the change made...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
