events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    client_max_body_size 20M;

    # SERVIDOR 1: Redirección obligatoria de HTTP a HTTPS
    server {
        listen 80;
        server_name _;
        
        # Redirige todo el tráfico del puerto 80 al 443 con código 301 (Permanente)
        return 301 https://$host$request_uri;
    }

    # SERVIDOR 2: El servidor principal HTTPS
    server {
        listen 443 ssl;
        server_name _; 

        # Rutas a los certificados montados en Docker
        ssl_certificate /etc/nginx/certs/johnson.crt;
        ssl_certificate_key /etc/nginx/certs/johnson.key;

        # Protocolos de seguridad corporativos recomendados
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Tráfico general (Vistas y API)
        location / {
            proxy_pass http://app:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https; # IMPORTANTE: Informa a Spring que es HTTPS

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Soporte para WebSockets (Notificaciones en tiempo real)
        location /ws-johnson {
            proxy_pass http://app:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}