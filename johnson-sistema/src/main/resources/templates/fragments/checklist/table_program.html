<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="tablaProgram(fase)" th:if="${fase.nombre.contains('Program')}" class="card glass-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-bordered mb-0 align-middle" style="font-size: 0.85rem; white-space: nowrap;">
                    <thead class="bg-light small text-uppercase text-muted fw-bold">
                        <tr>
                            <th class="text-center align-middle" style="width: 5%;">Champion</th>
                            <th class="align-middle" style="width: 20%; white-space: normal;">Deliverables</th>
                            <th class="text-center align-middle" style="width: 14%;">Dates</th>
                            <th class="text-center align-middle" style="width: 30%;">Status</th>
                            <th class="text-center align-middle" style="width: 15%;">Score</th>
                            <th class="align-middle" style="width: 8%; white-space: normal;">Remarks</th>
                            <th class="text-center align-middle" style="width: 5%;" title="Evidence">
                                <i class="bi bi-paperclip fs-5 text-secondary"></i>
                            </th>
                        </tr>
                    </thead>                                        
                    <tbody>
                        <th:block th:each="item, iterStat : ${fase.items}">
                            <tr th:if="${iterStat.index == 0 or !fase.items[iterStat.index - 1].etapaVisual.equals(item.etapaVisual)}" class="table-group-header">
                                <td colspan="7" class="fw-bold text-uppercase py-2 px-3 text-dark">
                                    <i class="bi bi-collection me-2 text-primary"></i><span th:text="${item.etapaVisual}"></span>
                                </td>
                            </tr>
                            
                            <tr>
                                <td class="text-center fw-bold align-middle">
                                    <span class="badge w-100 shadow-sm" 
                                          th:with="normChamp=${@checklistServicio.normalizarChampion(item.champion)}"
                                          th:classappend="'champ-' + ${#strings.toLowerCase(normChamp).replace('/', '-')}" 
                                          th:text="${normChamp}"
                                          th:title="${@checklistServicio.obtenerNombreCompletoChampion(normChamp)}"></span>
                                </td>
                                <td class="align-middle" style="background-color: rgba(255, 250, 205, 0.4) !important; white-space: normal;">
                                    <span class="d-block fw-bold text-dark" th:text="${item.nombre}"></span>
                                </td>
                                
                                <td class="align-middle px-2">
                                    <div class="d-flex align-items-center mb-1 pb-1 border-bottom border-light">
                                        <span class="badge bg-light text-muted border me-2 shadow-sm px-1" 
                                            style="min-width: 65px;">PLAN</span>
                                        <input type="date" class="form-control form-control-sm border-0 bg-transparent text-center p-0 fw-bold text-secondary flex-grow-1" 
                                                th:name="'fechaPlan-' + ${item.id}" th:value="${item.fechaPlan}">
                                    </div>
    
                                    <div class="d-flex align-items-center mt-1">
                                        <span class="badge bg-light text-dark border border-secondary border-opacity-25 me-2 shadow-sm px-1" 
                                            style="min-width: 65px;">ACTUAL</span>
                                        <input type="date" class="form-control form-control-sm border-0 bg-transparent text-center p-0 fw-bold flex-grow-1" 
                                                th:name="'fechaReal-' + ${item.id}" th:value="${item.fechaReal}">
                                    </div>
                                </td>
                                <td class="text-center align-middle">
                                    <select class="form-select form-select-sm border-0 fw-bold text-center" th:name="'controlEntregable-' + ${item.id}"
                                            th:classappend="${
                                                item.controlEntregable == 'Closed on time' ? 'status-on-time' :
                                                (item.controlEntregable == 'Closed late' ? 'status-late' :
                                                (item.controlEntregable == 'DECISION' ? 'status-decision' :
                                                (item.controlEntregable == 'NEEDS ACTION' ? 'status-needs-action' : 'status-default')))}">
                                        <option value="" th:selected="${item.controlEntregable == '' || item.controlEntregable == null}"></option> 
                                        <option th:selected="${item.controlEntregable == 'Closed on time'}" value="Closed on time">ON TIME</option>
                                        <option th:selected="${item.controlEntregable == 'Closed late'}" value="Closed late">LATE</option>
                                        <option th:selected="${item.controlEntregable == 'DECISION'}" value="DECISION">DECISION</option>
                                        <option th:selected="${item.controlEntregable == 'NEEDS ACTION'}" value="NEEDS ACTION">NEEDS ACTION</option>
                                    </select>
                                </td>
                                <td class="text-center align-middle">
                                    <select class="form-select form-select-sm border-0 fw-bold text-center" th:name="'score-' + ${item.id}"
                                            th:classappend="${item.score == 'OK' ? 'status-on-time' : (item.score == 'N/A' ? 'status-default' : 'status-default')}">
                                        <option value="" th:selected="${item.score == '' || item.score == null}"></option> 
                                        <option th:selected="${item.score == 'OK'}" value="OK">OK</option>
                                        <option th:selected="${item.score == 'N/A'}" value="N/A">N/A</option>
                                    </select>
                                </td>
                                
                                <td class="remarks-cell">
                                    <div class="remarks-preview-container" th:onclick="abrirEditorComentarios([[${item.id}]], [[${item.codigo}]])">
                                        <div class="remarks-text" th:id="'preview-comentario-' + ${item.id}"
                                             th:classappend="${item.comentario == null or item.comentario.isEmpty() ? 'text-muted fst-italic' : 'text-dark fw-bold'}"
                                             th:text="${item.comentario == null or item.comentario.isEmpty() ? '' : item.comentario}">
                                        </div>
                                        <button type="button" 
                                                th:id="'btn-comentario-' + ${item.id}"
                                                th:class="${item.comentario != null and !item.comentario.empty} ? 
                                                          'btn btn-sm btn-primary border-0 rounded-circle shadow-sm flex-shrink-0' : 
                                                          'btn btn-sm btn-light text-secondary border-0 rounded-circle shadow-sm flex-shrink-0'"
                                                style="width: 24px; height: 24px; padding: 0; display: flex; align-items: center; justify-content: center;">
                                            <i th:id="'btn-icon-comentario-' + ${item.id}" 
                                               th:class="${item.comentario != null and !item.comentario.empty} ? 'bi bi-chat-text-fill' : 'bi bi-pencil'" style="font-size: 0.75rem;"></i>
                                        </button>
                                    </div>
                                    <textarea class="d-none" th:name="'comentario-' + ${item.id}" th:id="'real-comentario-' + ${item.id}" th:text="${item.comentario}"></textarea>
                                </td>
                                
                                <td class="text-center align-middle">
                                    <button type="button" class="btn btn-sm border shadow-sm rounded-circle" 
                                            th:id="'btn-evidencia-' + ${item.id}"
                                            th:classappend="${item.adjuntos != null and !item.adjuntos.isEmpty()} ? 'btn-primary' : 'btn-light'"
                                            data-bs-toggle="modal" 
                                            th:data-bs-target="'#modalEvidencia_' + ${item.id}"
                                            title="Upload/View Evidence">                                                            
                                            <i th:id="'btn-icon-evidencia-' + ${item.id}" class="bi bi-cloud-arrow-up-fill" th:classappend="${item.adjuntos != null and !item.adjuntos.isEmpty()} ? 'text-white' : 'text-primary'"></i>
                                    </button>
                                </td>
                            </tr>
                        </th:block>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
