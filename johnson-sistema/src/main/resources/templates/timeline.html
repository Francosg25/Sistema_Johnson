<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

    <style>
        /* KPIs SUPERIORES */
        .kpi-card { border-radius: 12px; padding: 1.5rem; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .kpi-card::after { content: ''; position: absolute; top: -50%; right: -20%; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .bg-ontime { background: linear-gradient(135deg, #3ac47d 0%, #28a745 100%); }
        .bg-fulfilled { background: linear-gradient(135deg, #3f6ad8 0%, #0056b3 100%); }
        .bg-delayed { background: linear-gradient(135deg, #f7b924 0%, #fd7e14 100%); }
        .bg-escalation { background: linear-gradient(135deg, #d92550 0%, #dc3545 100%); }

        #visualization { width: 100%; height: 500px; border: 1px solid #e9ecef; border-radius: 8px; background-color: #fff; }
        
        .vis-labelset .vis-label { font-weight: bold; color: #495057; font-size: 0.85rem; text-transform: uppercase; }
        
        .vis-item.vis-milestone {
            border-color: #f58220; border-width: 3px; background-color: #fff; 
            border-radius: 0; transform: rotate(45deg);
        }
        .vis-item.vis-milestone .vis-item-content {
            margin-left: 15px; font-weight: bold; font-size: 0.8rem;
        }

        .vis-item.vis-event-internal {
            background-color: #3f6ad8; border-color: #004494; color: white; 
            border-radius: 4px; font-size: 0.75rem; font-weight: 500; padding: 2px 8px;
        }

        .vis-item.vis-event-external {
            background-color: #f7b924; border-color: #d39e00; color: black; 
            border-radius: 4px; font-size: 0.75rem; font-weight: 600; padding: 2px 8px;
        }

        
    </style>
</head>
<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper">
            <div th:replace="~{fragments/sidebar :: sidebar(currentUri='/timeline')}"></div>
        </div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>

            <main class="container-fluid p-4">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold text-dark mb-1"><i class="bi bi-calendar3-range text-primary me-2"></i>Multiple Project Timeline</h4>
                        <p class="text-muted small mb-0">Vista general de hitos.</p>
                    </div>
                </div>

                

                <div class="mb-3 p-3 bg-white shadow-sm rounded border d-flex gap-4">
                    <div class="form-check">
                        <input class="form-check-input filter-checkbox" type="checkbox" id="chkMilestones" checked>
                        <label class="form-check-label fw-bold small text-uppercase" for="chkMilestones">
                            <i class="bi bi-diamond text-dark me-1"></i> Milestones
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input filter-checkbox" type="checkbox" id="chkInternal" checked>
                        <label class="form-check-label fw-bold small text-uppercase" for="chkInternal">
                            <i class="bi bi-square-fill text-primary me-1"></i> Main Events (Internal)
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input filter-checkbox" type="checkbox" id="chkExternal" checked>
                        <label class="form-check-label fw-bold small text-uppercase" for="chkExternal">
                            <i class="bi bi-square-fill text-warning me-1"></i> Main Events (External)
                        </label>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                        <h6 class="m-0 fw-bold text-dark"><i class="bi bi-bar-chart-steps me-2"></i>Master Schedule</h6>
                    </div>
                    <div class="card-body p-3">
                        <div id="visualization"></div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div class="modal fade" id="modalDetalleTimeline" tabindex="-1" aria-hidden="true" style="backdrop-filter: blur(4px);">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 12px;">
                <div class="modal-header bg-light border-bottom-0 pb-2">
                    <h6 class="modal-title fw-bold text-dark"><i class="bi bi-info-circle text-primary me-2"></i>Detalle del Evento</h6>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center pt-2 pb-4">
                    <div class="mb-3">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle" style="width: 50px; height: 50px;">
                            <i class="bi bi-calendar-check fs-3"></i>
                        </div>
                    </div>
                    <h5 id="detalle-nombre" class="fw-bold text-dark mb-1">Nombre</h5>
                    <p class="text-muted small mb-3">Fecha Planificada / Real</p>
                    <div class="bg-light rounded p-2 border">
                        <h5 id="detalle-fecha" class="text-primary fw-bold mb-0">YYYY-MM-DD</h5>
                    </div>
                </div>
                <div class="modal-footer border-top-0 justify-content-center bg-light">
                    <button type="button" class="btn btn-sm btn-secondary px-4 fw-bold" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var container = document.getElementById('visualization');

            /*<![CDATA[*/
            var rawGroups = /*[[${timelineGroups}]]*/ [];
            var rawItems = /*[[${timelineItems}]]*/ [];
            /*]]>*/

            var groups = new vis.DataSet(rawGroups);
            var items = new vis.DataSet(rawItems);

            var view = new vis.DataView(items, {
                filter: function (item) {
                    var showMilestones = document.getElementById('chkMilestones').checked;
                    var showInternal = document.getElementById('chkInternal').checked;
                    var showExternal = document.getElementById('chkExternal').checked;

                    if (item.className === 'vis-milestone' && showMilestones) return true;
                    if (item.className === 'vis-event-internal' && showInternal) return true;
                    if (item.className === 'vis-event-external' && showExternal) return true;
                    
                    return false;
                }
            });

            var options = {
                groupOrder: 'id',
                editable: false,
                margin: { item: 15, axis: 30 },
                orientation: 'top',
                timeAxis: {scale: 'month', step: 1},
                
                horizontalScroll: true,       
                zoomKey: 'ctrlKey',          
                zoomMin: 1000 * 60 * 60 * 24 * 30 * 3, 
                zoomMax: 1000 * 60 * 60 * 24 * 30 * 18, 
                stack: true                  
            };

            var timeline = new vis.Timeline(container, view, groups, options);

            timeline.on('select', function (properties) {
                if (properties.items.length > 0) {
                    var itemId = properties.items[0];
                    var itemData = items.get(itemId); 
                    
                    document.getElementById('detalle-nombre').innerText = itemData.content;
                    
                    var fechaObj = new Date(itemData.start);
                    var opcionesFecha = { timeZone: 'UTC', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    document.getElementById('detalle-fecha').innerText = fechaObj.toLocaleDateString('es-ES', opcionesFecha);
                    
                    var modalEl = document.getElementById('modalDetalleTimeline');
                    var modalObj = bootstrap.Modal.getOrCreateInstance(modalEl);
                    modalObj.show();
                }
            });

            // 7. Activar interactividad de los filtros
            document.querySelectorAll('.filter-checkbox').forEach(function(checkbox) {
                checkbox.addEventListener('change', function() {
                    view.refresh(); 
                });
            });

        });
    </script>
</body>
</html>
