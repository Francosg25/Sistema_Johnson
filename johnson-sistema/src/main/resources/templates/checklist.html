<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <div th:replace="~{fragments/checklist/styles :: styles}"></div>
</head>
<body>

<div class="d-flex" id="wrapper">
    <div id="sidebar-wrapper"><div th:replace="~{fragments/sidebar :: sidebar(currentUri=${currentUri})}"></div></div>

    <div id="page-content-wrapper" class="w-100">
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>

        <main class="container-fluid p-4">
            <div th:replace="~{fragments/checklist/header_info :: header_info}"></div>
            <div th:replace="~{fragments/checklist/milestones_card :: milestones_card}"></div>
            <div th:replace="~{fragments/checklist/champion_legend :: champion_legend}"></div>

            <form th:action="@{/proyectos/checklist/guardar-todo/{id}(id=${proyecto.id})}" method="post" id="formChecklist">
                <nav class="mb-4">
                    <div class="nav nav-tabs border-0" id="nav-tab" role="tablist">
                        <button th:each="fase, stat : ${fases}" 
                                class="nav-link shadow-sm" 
                                th:classappend="${stat.first ? 'active' : ''}"
                                th:id="'nav-' + ${fase.id} + '-tab'" 
                                data-bs-toggle="tab" 
                                th:data-bs-target="'#nav-' + ${fase.id}" 
                                type="button" role="tab" 
                                th:aria-controls="'nav-' + ${fase.id}" 
                                th:aria-selected="${stat.first}" 
                                th:text="${fase.nombre}">Fase</button>
                    </div>
                </nav>

                <div class="tab-content" id="nav-tabContent">
                    <div th:each="fase, stat : ${fases}" 
                         class="tab-pane fade" 
                         th:classappend="${stat.first ? 'show active' : ''}"
                         th:id="'nav-' + ${fase.id}" 
                         role="tabpanel" 
                         th:aria-labelledby="'nav-' + ${fase.id} + '-tab'">
                        
                        <div th:if="${fase.id == 'prog'}">
                            <div th:replace="~{fragments/checklist/table_program :: table_program(${fase})}"></div>
                        </div>
                        <div th:if="${fase.id != 'prog'}">
                            <div th:replace="~{fragments/checklist/table_gate :: table_gate(${fase})}"></div>
                        </div>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>

<div th:replace="~{fragments/checklist/modals :: modals(${fases})}"></div>
<div th:replace="~{fragments/checklist/scripts :: scripts}"></div>

</body>
</html>
