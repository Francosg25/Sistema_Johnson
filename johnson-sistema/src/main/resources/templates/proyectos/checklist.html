<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" th:href="@{/css/checklist.css}" />
</head>

<body class="bg-light">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper">
            <div th:replace="~{fragments/sidebar :: sidebar(currentUri=${currentUri})}"></div>
        </div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>

            <main class="container-fluid p-4">

                <div id="checklist-skeleton" class="container-fluid p-4">
                    <div class="glass-card p-4 mb-4">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <div class="skeleton skeleton-title" style="width: 40%; height: 28px;"></div>
                                <div class="skeleton skeleton-text" style="width: 25%;"></div>
                            </div>
                            <div class="col-md-4 text-end">
                                <div class="skeleton" style="width: 120px; height: 36px; border-radius: 8px; display: inline-block;"></div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex mb-3">
                        <div class="skeleton me-2" style="width: 100px; height: 40px; border-radius: 8px 8px 0 0;"></div>
                        <div class="skeleton me-2" style="width: 100px; height: 40px; border-radius: 8px 8px 0 0;"></div>
                        <div class="skeleton me-2" style="width: 100px; height: 40px; border-radius: 8px 8px 0 0;"></div>
                    </div>
                </div>

                <div id="checklist-content" style="display: none;">
                    
                    <div th:if="${errorFinalizar}" class="alert alert-danger border-0 shadow-sm mb-4 rounded-4 animate__animated animate__fadeIn">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-exclamation-octagon-fill fs-3 me-3"></i>
                            <div>
                                <h6 class="fw-bold mb-1">Cannot Finalize Project</h6>
                                <p class="mb-0 small">The following requirements must be met before archiving:</p>
                                <ul class="mb-0 small mt-2">
                                    <li th:each="err : ${errorFinalizar}" th:text="${err}">Error</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-end mb-4">
                        <div>
                            <h6 class="text-uppercase text-muted small fw-bold mb-1">Project</h6>
                            <span class="badge bg-secondary fs-6 shadow-sm" th:text="${proyecto.numeroParte}">NUM</span>
                            <span class="ms-2 fw-bold text-dark fs-5" th:text="${proyecto.nombre}">Nombre</span>
                        </div>
                        <div class="d-flex align-items-center">
                            <div th:if="${proyecto.esHistorico or proyecto.archivado}" class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25 px-3 py-2 me-3 rounded-pill d-flex align-items-center" style="font-size: 0.75rem;">
                                <i class="bi bi-lock-fill me-2"></i>
                                <span class="fw-bold">READ-ONLY MODE</span>
                            </div>
                            
                            <a href="/" class="btn btn-outline-secondary btn-sm me-3 shadow-sm fw-bold">Back</a>
                            
                            <div sec:authorize="hasRole('ADMIN')" class="me-3">
                                <button type="button" class="btn btn-sm btn-dark fw-bold shadow-sm px-3" data-bs-toggle="modal" data-bs-target="#modalFinalizarProyecto" th:if="${!proyecto.esHistorico and !proyecto.archivado}">
                                    <i class="bi bi-check-circle-fill me-1"></i> FINISH PROJECT
                                </button>
                            </div>

                            <div class="btn-group shadow-sm">
                                <button type="submit" id="btnGuardarTodo" form="formChecklist" class="btn btn-je-primary btn-sm px-3 d-flex align-items-center" th:if="${!proyecto.esHistorico and !proyecto.archivado}" sec:authorize="hasAnyRole('ADMIN', 'CHAMPION')" title="Save all changes">
                                    <i class="bi bi-save2-fill me-2"></i> Save
                                </button>
                                <a th:href="@{/reportes/proyecto/ver/{id}(id=${proyecto.id})}" target="_blank"
                                        style="background-color: #0b6ded; border: none; color: white;"
                                        class="btn btn-sm px-3 d-flex align-items-center"
                                        title="View Executive Report Online">
                                        <i class="bi bi-eye-fill"></i>
                                     </a>
                                     
                                    <a th:href="@{/proyectos/exportar-pdf/{id}(id=${proyecto.id})}" target="_blank"
                                        style="background-color: #d84040; border: none; color: white;"
                                        class="btn btn-sm px-3 d-flex align-items-center" 
                                        title="Download PDF Report">
                                        <i class="bi bi-file-earmark-pdf-fill"></i>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="card glass-card border-0 shadow-sm mb-4 border-start border-4 border-warning">
                            <div class="card-body py-3 px-4">
                                <h6 class="fw-bold text-dark mb-3"></i>Project Executive Milestones (Launch Overview)</h6>
                                <form th:action="@{/proyectos/guardar-hitos/{id}(id=${proyecto.id})}" method="post" id="formHitosProyecto">
                                    <div class="row g-3">
                                        <div class="col-md-3">
                                            <label class="form-label small fw-bold text-muted mb-1">💰 CAR Approval</label>
                                            <input type="date" class="form-control form-control-sm border-0 bg-light update-hito" name="fechaCar" th:value="${proyecto.fechaCar}" th:disabled="${!#authorization.expression('hasRole(''ADMIN'')')}">
                                        </div>
                                        <div class="col-md-3">
                                            <label class="form-label small fw-bold text-muted mb-1">👥 Line Buy-off</label>
                                            <input type="date" class="form-control form-control-sm border-0 bg-light update-hito" name="fechaBuyoff" th:value="${proyecto.fechaBuyoff}" th:disabled="${!#authorization.expression('hasRole(''ADMIN'')')}">
                                        </div>
                                        <div class="col-md-3">
                                            <label class="form-label small fw-bold text-muted mb-1">🚢 Equipment Ship</label>
                                            <input type="date" class="form-control form-control-sm border-0 bg-light update-hito" name="fechaTransit" th:value="${proyecto.fechaTransit}" th:disabled="${!#authorization.expression('hasRole(''ADMIN'')')}">
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div class="card glass-card border-0 shadow-sm mb-4">
                            <div class="card-body py-3 px-4">
                                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                                    <div class="d-flex flex-wrap gap-3 small fw-medium text-muted">
                                        <div class="d-flex align-items-center" title="Quality Engineer">
                                            <span class="badge champ-qe me-2 shadow-sm">QE</span> Quality
                                        </div>
                                        <div class="d-flex align-items-center" title="Process/Manufacturing Engineer">
                                            <span class="badge champ-pe me-2 shadow-sm">PE</span> Process
                                        </div>
                                        <div class="d-flex align-items-center" title="Design/Product Engineer">
                                            <span class="badge champ-de me-2 shadow-sm">DE</span> Design
                                        </div>
                                        <div class="d-flex align-items-center" title="Project Leader">
                                            <span class="badge champ-proj me-2 shadow-sm">PROJ</span> Project Manager
                                        </div>
                                        <div class="d-flex align-items-center" title="Quality & Process (Responsabilidad Compartida)">
                                            <span class="badge champ-qe-pe me-2 shadow-sm">QE/PE</span> Quality and Process
                                        </div>
                                        <div class="d-flex align-items-center" title="Cross-Functional Team">
                                            <span class="badge champ-all me-2 shadow-sm">ALL</span> All Team (CFT)
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <form th:action="@{/proyectos/checklist/guardar-ajax/{id}(id=${proyecto.id})}" method="post" id="formChecklist">
                            <ul class="nav nav-tabs nav-fill mb-4 border-bottom-0" id="apqpTabs" role="tablist">
                                <li class="nav-item" role="presentation" th:each="fase : ${fases}">
                                    <button class="nav-link border-0 shadow-sm me-2" 
                                            th:classappend="'bg-light text-muted'"
                                            th:id="'tab-' + ${fase.id}" 
                                            data-bs-toggle="tab" 
                                            th:data-bs-target="'#content-' + ${fase.id}" 
                                            type="button" role="tab" 
                                            th:text="${#strings.replace(fase.nombre, 'Stage', 'Gate')}">
                                        Fase
                                    </button>
                                </li>
                            </ul>

                            <div class="tab-content" id="apqpTabsContent">
                                <div th:each="fase, faseIter : ${fases}" 
                                     class="tab-pane fade" 
                                     th:classappend="${faseIter.index == 0} ? 'show active'" 
                                     th:id="'content-' + ${fase.id}" 
                                     role="tabpanel">

                                    <div th:replace="~{fragments/checklist/table_program :: tablaProgram(${fase})}"></div>
                                    <div th:replace="~{fragments/checklist/table_stage2 :: tablaStage2(${fase})}"></div>
                                    <div th:replace="~{fragments/checklist/table_gates :: tablaGates(${fase}, ${proyecto}, ${firmasGate3}, ${firmasGate4}, ${firmasGate5})}"></div>

                                </div>
                            </div>
                        </form>

                        <th:block th:each="fase : ${fases}">
                            <th:block th:each="item : ${fase.items}">
                                <div th:replace="~{fragments/checklist/modals :: modalEvidencia(${item})}"></div>
                            </th:block>
                        </th:block>

                        <div th:replace="~{fragments/checklist/modals :: modalComentarios}"></div>
                        <div th:replace="~{fragments/checklist/modals :: modalEliminarEvidencia}"></div>
                        <div th:replace="~{fragments/checklist/modals :: modalFinalizarProyecto(${proyecto})}"></div>
                        <div th:replace="~{fragments/checklist/modals :: modalFirmas}"></div>

                        <div id="checklist-config" class="d-none"
                            th:data-es-historico="${proyecto.esHistorico}"
                            th:data-puede-editar="${#authorization.expression('hasAnyRole(''ADMIN'', ''CHAMPION'')')}">
                        </div>
                    </div>

                    </div>
                </div>

            </main>
        </div>

    <link rel="stylesheet" href="https://unpkg.com/tributejs/dist/tribute.css">
    <script src="https://unpkg.com/tributejs/dist/tribute.min.js"></script>
    <script th:src="@{/js/checklist.js}"></script>
</body>
</html>
