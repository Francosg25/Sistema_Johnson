<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper"><div th:replace="~{fragments/sidebar :: sidebar(currentUri='reportes')}"></div></div>

        <div id="page-content-wrapper" class="w-100">
            <div th:replace="~{fragments/header :: header}"></div>

            <main class="container-fluid p-4">
                <h3 class="fw-bold text-dark mb-4">Reportes de Progreso APQP</h3>

                <div class="row g-4 mb-5">
                    <div class="col-md-3" th:each="dato, stat : ${datosGrafica}">
                        <div class="card border-0 shadow-sm h-100"
                             th:classappend="${stat.index % 5 == 0 ? 'border-start border-4 border-primary' :
                                               (stat.index % 5 == 1 ? 'border-start border-4 border-success' :
                                               (stat.index % 5 == 2 ? 'border-start border-4 border-warning' :
                                               (stat.index % 5 == 3 ? 'border-start border-4 border-danger' :
                                               'border-start border-4 border-info')))}">
                            <div class="card-body">
                                <h6 class="text-muted text-uppercase small fw-bold" th:text="${dato.nombreProyecto}">PROYECTO</h6>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <h2 class="fw-bold mb-0 text-dark">
                                        <span th:text="${dato.porcentaje}">0</span>%
                                    </h2>
                                    <span class="badge bg-light text-secondary border">
                                        <span th:text="${dato.completados}">0</span>/<span th:text="${dato.totalEntregables}">0</span> Items
                                    </span>
                                </div>
                                <div class="progress mt-3" style="height: 6px;">
                                    <div class="progress-bar" role="progressbar" 
                                         th:classappend="${stat.index % 5 == 0 ? 'bg-primary' :
                                                           (stat.index % 5 == 1 ? 'bg-success' :
                                                           (stat.index % 5 == 2 ? 'bg-warning' :
                                                           (stat.index % 5 == 3 ? 'bg-danger' :
                                                           'bg-info')))}"
                                         th:style="'width: ' + ${dato.porcentaje} + '%'"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white py-3">
                                <h6 class="m-0 fw-bold text-primary"><i class="bi bi-bar-chart-fill me-2"></i>Comparativa de Avance (%)</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartProgreso"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white py-3">
                                <h6 class="m-0 fw-bold text-primary"><i class="bi bi-pie-chart-fill me-2"></i>Volumen de Entregables</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartVolumen"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <script th:inline="javascript">
        /*<![CDATA[*/
        
        var reportes = /*[[${datosGrafica}]]*/ [];

        var nombres = reportes.map(r => r.nombreProyecto);
        var porcentajes = reportes.map(r => r.porcentaje);
        var totales = reportes.map(r => r.totalEntregables);

        const ctx1 = document.getElementById('chartProgreso');
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: nombres,
                datasets: [{
                    label: '% Completado',
                    data: porcentajes,
                    backgroundColor: [
                        'rgba(13, 110, 253, 0.7)', // primary
                        'rgba(25, 135, 84, 0.7)',  // success
                        'rgba(255, 193, 7, 0.7)',  // warning
                        'rgba(220, 53, 69, 0.7)',  // danger
                        'rgba(13, 202, 240, 0.7)'   // info
                    ],
                    borderColor: [
                        'rgba(13, 110, 253, 1)',
                        'rgba(25, 135, 84, 1)',
                        'rgba(255, 193, 7, 1)',
                        'rgba(220, 53, 69, 1)',
                        'rgba(13, 202, 240, 1)'
                    ],
                    borderWidth: 1,
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, max: 100 }
                }
            }
        });

        const ctx2 = document.getElementById('chartVolumen');
        new Chart(ctx2, {
            type: 'doughnut',
            data: {
                labels: nombres,
                datasets: [{
                    label: 'Total Entregables',
                    data: totales,
                    backgroundColor: [
                        '#cce5ff', // champ-proj (light blue)
                        '#d4edda', // champ-de (light green)
                        '#fff3cd', // champ-qe (light yellow)
                        '#f8d7da', // champ-pe (light red/pink)
                        '#e2e3e5', // champ-ops (light grey)
                        '#d1ecf1'  // champ-all (light cyan)
                    ],
                    hoverOffset: 4
                }]
            }
        });

        /*]]>*/
    </script>
</body>
</html>
