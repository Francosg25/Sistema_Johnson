spring.application.name=johnson-sistema
server.port=8081

#  CONFIGURACIÓN POSTGRESQL USANDO VARIABLES DE ENTORNO 
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-className=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0

#  JPA / HIBERNATE 
# 'update' crea las tablas automáticamente si no existen sin borrar los datos previos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para PostgreSQL 12 o superior
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#  LOGGING DEBUGGING 
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Permitir subir evidencias de hasta 15 Megabytes
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

#  CONFIGURACIÓN DE EMAIL (Ejemplo con Gmail) 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${SPRING_MAIL_USERNAME}
app.mail.display-name=Johnson APQP System

# CACHE (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=15m

# Habilitar compresión de respuestas HTTP para recursos estáticos y JSON
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript

# HTTP/2
server.http2.enabled=true





