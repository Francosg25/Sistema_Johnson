<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${proyecto.id == null ? 'New Project | Johnson Electric' : 'Edit Project | Johnson Electric'}">Project Form</title>
    
    <th:block layout:fragment="custom-css">
        <style>
            .glass-card {
                background: white !important;
                border: 1px solid rgba(226, 232, 240, 0.8) !important;
                border-radius: 20px !important;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04) !important;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .glass-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1) !important;
            }
            .glass-header {
                background: #1e293b !important;
                color: white !important;
                border-radius: 20px 20px 0 0 !important;
                padding: 1.25rem 1.5rem !important;
                border-bottom: none !important;
            }
            .form-control-premium {
                border: 1px solid #e2e8f0;
                background-color: #f8fafc;
                border-radius: 10px;
                padding: 0.6rem 1rem;
                font-weight: 500;
                color: #1e293b;
                transition: all 0.2s ease;
            }
            .form-control-premium:focus {
                background-color: #ffffff;
                border-color: #F5821F;
                box-shadow: 0 0 0 3px rgba(245, 130, 31, 0.15);
            }
            .btn-je-primary {
                background: #F5821F !important;
                border-radius: 10px !important;
                padding: 0.75rem 2rem !important;
                font-weight: 800 !important;
                color: white !important;
                border: none !important;
                box-shadow: 0 4px 12px rgba(245, 130, 31, 0.2) !important;
            }
            .btn-je-primary:hover {
                background: #e67616 !important;
                transform: translateY(-2px);
            }
        </style>
    </th:block>
</head>

<body>
    <main layout:fragment="content">
        
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 class="fw-black text-dark m-0 d-flex align-items-center" style="font-weight: 900; letter-spacing: -1px;">
                    <div class="rounded-3 p-2 me-3" style="background: rgba(245, 130, 31, 0.1);">
                        <i class="bi" th:classappend="${proyecto.id == null ? 'bi-rocket-takeoff-fill' : 'bi-pencil-square'} " style="color: #F5821F;"></i>
                    </div>
                    <span th:text="${proyecto.id == null ? 'Initialize APQP Project' : 'Edit Project Data'}">Project</span>
                </h2>
            </div>
            <a th:href="@{/}" class="btn btn-light rounded-pill px-4 py-2 fw-bold shadow-sm text-dark border-0">
                <i class="bi bi-arrow-left me-2"></i>Dashboard
            </a>
        </div>

        <form th:action="@{/proyectos/guardar}" th:object="${proyecto}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="row g-4">
                <div class="col-xl-6">
                    <div class="card glass-card h-100">
                    
                        <div class="card-body p-4">
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-1">Project Name</label>
                                <input type="text" th:field="*{nombre}" class="form-control form-control-premium form-control-lg fs-6 fw-bold" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted text-uppercase mb-1">Part Number</label>
                                    <input type="text" th:field="*{numeroParte}" class="form-control form-control-premium">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted text-uppercase mb-1">Customer</label>
                                    <input type="text" th:field="*{cliente}" class="form-control form-control-premium">
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-uppercase mb-1" style="color: #F5821F;">Application</label>
                                    <input type="text" th:field="*{aplicacion}" class="form-control form-control-premium">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-uppercase mb-1" style="color: #F5821F;">Line</label>
                                    <input type="text" th:field="*{linea}" class="form-control form-control-premium" >
                                </div>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted text-uppercase mb-1">Product</label>
                                    <input type="text" th:field="*{producto}" class="form-control form-control-premium">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted text-uppercase mb-1">Revision Reason</label>
                                    <input type="text" th:field="*{razonRevision}" class="form-control form-control-premium">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-xl-6">
                    <div class="card glass-card h-100">
                       
                        <div class="card-body p-4">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted text-uppercase mb-1">Line Arrival (Zacatecas)</label>
                                    <div class="input-group">
                                        <input type="date" th:field="*{fechaLineArrival}" class="form-control form-control-premium text-center">
                                        <span class="input-group-text bg-light border-0">-</span>
                                        <input type="date" th:field="*{fechaLineArrivalFin}" class="form-control form-control-premium text-center">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted text-uppercase mb-1">PV Build</label>
                                    <div class="input-group">
                                        <input type="date" th:field="*{fechaPvBuild}" class="form-control form-control-premium text-center">
                                        <span class="input-group-text bg-light border-0">-</span>
                                        <input type="date" th:field="*{fechaPvBuildFin}" class="form-control form-control-premium text-center">
                                    </div>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted text-uppercase mb-1">Start Date</label>
                                    <input type="date" th:field="*{fechaInicio}" class="form-control form-control-premium text-center">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-uppercase mb-1" style="color: #F5821F;">PPAP Date</label>
                                    <input type="date" th:field="*{fechaPpap}" class="form-control form-control-premium text-center">
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted text-uppercase mb-1">SOP Date</label>
                                    <input type="date" th:field="*{sop}" class="form-control form-control-premium text-center" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-uppercase mb-1" style="color: #F5821F;">Safe Launch Finish</label>
                                    <input type="date" th:field="*{fechaTerminoSafeLaunch}" class="form-control form-control-premium text-center">
                                </div>
                            </div>
                            
                            <hr class="my-4 border-light opacity-50">
                            
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-1">Program Manager <span class="badge bg-light text-dark border ms-2">F7100 Standard</span></label>
                                <div class="input-group">
                                    <span class="input-group-text border-0 bg-light" style="border-radius: 10px 0 0 10px;"><i class="bi bi-person-fill text-muted"></i></span>
                                    <input type="text" th:field="*{programManager}" class="form-control form-control-premium border-start-0" style="border-radius: 0 10px 10px 0;" placeholder="PM Name">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end mt-5 gap-3">
                <a th:href="@{/}" class="btn btn-light px-4 py-2 fw-bold text-muted border-0 shadow-sm rounded-pill">Discard</a>
                <button type="submit" class="btn btn-je-primary px-5 py-2 shadow-lg rounded-pill">
                    <i class="bi bi-save2-fill me-2"></i> Save Project 
                </button>
            </div>
        </form>
    </main>
</body>
</html>
